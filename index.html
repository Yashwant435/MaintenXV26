function v17Date(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

  for(const plant of selected){for(const [key,kind] of resources){const r=await fetch(sapBackendUrl+'/api/v1/sap/'+key+'?plant='+encodeURIComponent(plant)+'&top=100',{headers});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||kind+' read failed ('+r.status+').');}const data=await r.json();combined.push(...(data.records||[]).map((x,i)=>{const id=x.Equipment||x.MaintenanceNotification||x.Notification||x.MaintenanceOrder||x.Material||x.MaterialNumber||x.id||('Record '+(i+1));const name=x.EquipmentName||x.EquipmentDescription||x.NotificationText||x.MaintenanceOrderDesc||x.MaterialDescription||x.Description||id;const status=x.SystemStatusText||x.UserStatusText||x.MaintenanceOrderStatus||x.NotificationStatus||'Read from SAP';return {plant,plantName:'Plant '+plant,kind,id:String(id),name:String(name),status:String(status),detail:Object.entries(x).slice(0,7).map(([k,v])=>k+': '+String(v??'')).join(' · '),updated:data.retrievedAt||'Retrieved now'};}));}}
  sapLiveRecords=combined;sapLiveStatus='Connected · live read';sapPlantFilter='All';localStorage.setItem('maintenx_sap_backend_url',url);render();
 }catch(e){sapLiveStatus='Connection failed';render();alert('MaintenX backend connection failed: '+e.message+'\n\nCheck backend URL, API key, CORS, plant allow-list and SAP service configuration.');}
}

function saveCompressorEntry(e){

function calendarItems(){
 const items=[];
 db.pm.forEach(x=>{if(x.due)items.push({...x,kind:'PM',area:x.asset||'Maintenance',key:'pm'});});
 db.safety.forEach(x=>{if(x.due)items.push({...x,kind:'Safety',area:x.area||'Safety',key:'safety'});});
 return items;
}
function calendarPage(){
 const year=calendarMonth.getFullYear(), month=calendarMonth.getMonth();
 const first=new Date(year,month,1), start=new Date(year,month,1-first.getDay());
 const today=new Date();today.setHours(0,0,0,0);
 const items=calendarItems();
 const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const byDate={};items.forEach(x=>(byDate[x.due] ||= []).push(x));
 let cells='';
 for(let i=0;i<42;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const key=dateKey(d), dayItems=byDate[key]||[], isToday=key===dateKey(today);
  cells+=`<div class="cal-cell ${d.getMonth()!==month?'muted':''} ${isToday?'today':''}">
   <div class="cal-date">${d.getDate()}${isToday?' · Today':''}</div>
   ${dayItems.slice(0,3).map(x=>`<span class="cal-dot ${x.kind==='Safety'?'safety':''} ${x.status!=='Completed'&&new Date(x.due+'T00:00:00')<today?'overdue':''}" title="${esc(x.task)}">${x.kind==='Safety'?'S: ':'PM: '}${esc(x.task)}</span>`).join('')}
   ${dayItems.length>3?`<span class="cal-dot">+${dayItems.length-3} more</span>`:''}
  </div>`;
 }
 const overdue=items.filter(x=>x.status!=='Completed'&&new Date(x.due+'T00:00:00')<today);
 const dueToday=items.filter(x=>x.status!=='Completed'&&x.due===dateKey(today));
 const upcoming=items.filter(x=>x.status!=='Completed'&&x.due>dateKey(today)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
 const list=[...overdue.map(x=>({...x,flag:'Overdue'})),...dueToday.map(x=>({...x,flag:'Due today'})),...upcoming.map(x=>({...x,flag:'Upcoming'}))].slice(0,10);
 return `${heading('Maintenance Calendar','Monthly view of preventive maintenance and safety due dates', '')}
 <div class="panel">
  <div class="calendar-head">
   <button class="btn ghost small" onclick="changeCalendar(-1)">‹</button>
   <div class="month-label">${calendarMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>
   <button class="btn ghost small" onclick="changeCalendar(1)">›</button>
  </div>
  <div class="cal-grid">
   ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-dayname">${x}</div>`).join('')}
   ${cells}
  </div>
  <div class="cal-legend"><span><i class="legend-dot" style="background:#1769aa"></i>Preventive maintenance</span><span><i class="legend-dot" style="background:#d69a32"></i>Safety</span><span><i class="legend-dot" style="background:#c24141"></i>Overdue</span></div>
  <button class="btn secondary small" onclick="calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()">Go to current month</button>
 </div>
 <div class="grid section">
  <div class="stat"><div class="stat-top">Overdue</div><strong style="color:var(--red)">${overdue.length}</strong><small>Open tasks past due</small></div>
  <div class="stat"><div class="stat-top">Due today</div><strong>${dueToday.length}</strong><small>Open tasks due today</small></div>
 </div>
 <div class="section">
  <div class="section-title"><h2>Due date alerts</h2><span class="sub">Next tasks to action</span></div>
  <div class="panel">${list.length?list.map(x=>`<div class="alertrow"><div><b>${esc(x.task)}</b><div class="sub">${esc(x.kind)} · ${esc(x.area)} · ${esc(x.due)}</div></div>${pill(x.flag)}</div>`).join(''):'<div class="empty">No pending due dates. Add tasks in PM, Weekly, Monthly or Safety.</div>'}</div>
 </div>`;
}

function exportScrubCSV(){
 const cols=['date','shift','person','status','rpm','current','feed','remarks'];
 const pointCols=scrubberPoints.map(([p,a])=>sKey(p,a));
 const all=[...cols,...pointCols];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[all.join(','),...db.scrubberReadings.map(r=>all.map(k=>q(k.includes('|')?r.values?.[k]:r[k])).join(','))];
 const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MaintenX_Scrubber_Daily_Readings.csv';a.click();URL.revokeObjectURL(url);
}

 const dateLabel=escHtml(r.date||'—');
 const trendKey=key('Motor DE','H'),trend=readings.filter(x=>x.values?.[trendKey]!==''&&x.values?.[trendKey]!=null).slice(-10);

function reliabilityCentrePage(){

 const measured=scrubberPoints.length-stats['Not entered'];

 const conditionRows=groups.map(g=>{const states=g.points.flatMap(p=>['H','V'].map(a=>statusFor(p,a))),valid=states.filter(x=>x!=='Not entered'),normal=valid.filter(x=>x==='Normal').length,score=valid.length?Math.round(normal/valid.length*100):0,worst=states.includes('Alarm')?'Alarm':states.includes('Warning')?'Warning':valid.length?'Normal':'No data',col=worst==='Alarm'?'#c24141':worst==='Warning'?'#b7791f':worst==='Normal'?'#16845b':'#94a3b8';return `<div class="subsystem-row"><div><b>${g.name}</b><small>${valid.length}/${states.length} points</small></div><div><div class="health-track"><i style="width:${score}%;background:${col}"></i></div><small>${worst==='No data'?'Awaiting readings':worst+' condition'}</small></div><b style="text-align:right;color:${col}">${valid.length?score+'%':'—'}</b></div>`}).join('');

 const alertHtml=alerts.length?alerts.slice(0,6).map(x=>`<div class="reliability-alert"><span style="font-size:17px;color:${x.st==='Alarm'?'#c24141':'#b7791f'}">${x.st==='Alarm'?'▲':'●'}</span><div style="flex:1"><b>${esc(x.p)} · ${x.a}</b><p>${esc(x.v)} mm/s · ${x.st} · configured threshold</p></div><button class="btn secondary small" onclick="createScrubberAlertWO('${x.p}','${x.a}')">Create WO</button></div>`).join(''):'<div class="empty">No warning or alarm points in the latest inspection.</div>';

function rotorClass(kind,key,val){

function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function previewPhotos(input,target){const box=document.getElementById(target);if(!box)return;box.innerHTML='';[...input.files].slice(0,target==='orderPreview'?3:1).forEach(file=>{if(!file.type.startsWith('image/'))return;const img=document.createElement('img');img.src=URL.createObjectURL(file);box.appendChild(img)})}
async function imageData(input,max){const files=[...(input?.files||[])].slice(0,max);const out=[];for(const file of files){if(!file.type.startsWith('image/'))continue;if(file.size>2*1024*1024){alert('Please choose images smaller than 2 MB each.');continue;}out.push(await readImage(file));}return out}
async function saveOrder(e){e.preventDefault();let f=new FormData(e.target);let photos=await imageData(e.target.elements.photo,3);let id='WO-'+String(Date.now()).slice(-5);db.orders.unshift({id,title:f.get('title'),asset:f.get('asset'),type:f.get('type'),priority:f.get('priority'),status:'Open',assigned:f.get('assigned')||'Unassigned',date:v17Today(),remarks:f.get('remarks'),photos});save();closeModal();setPage('orders')}
function editOrder(id){let x=db.orders.find(o=>o.id===id);showModal('Update work order',`<p><b>${esc(x.title)}</b><br><span class="muted">${esc(x.id)} · ${esc(x.asset)}</span></p><div class="field"><label>Status</label><select id="newStatus"><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='In Progress'?'selected':''}>In Progress</option><option ${x.status==='Completed'?'selected':''}>Completed</option></select></div><div class="field" style="margin-top:10px"><label>Assigned to</label><input id="newAssigned" value="${esc(x.assigned)}"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="updateOrder('${id}')">Save changes</button></div>`)}
function updateOrder(id){
 let x=db.orders.find(o=>o.id===id),previous=x.status,next=document.getElementById('newStatus').value;
 x.status=next;x.assigned=document.getElementById('newAssigned').value;
 if(next==='Completed' && previous!=='Completed'){
   x.completedAt=v17Today();
   db.history.unshift({...JSON.parse(JSON.stringify(x)),historyId:'H-'+Date.now(),completedAt:x.completedAt});
 }
 save();closeModal();render()
}
// MaintenX Reliability Intelligence modules. Scores and recommendations are rules-based demo indicators, not certified diagnostics.
function assetScore(a){
 const jobs=db.history.filter(x=>x.asset===a.name||x.asset===a.id),breakdowns=jobs.filter(x=>x.type==='Breakdown').length;
 const overdue=db.pm.filter(x=>x.asset===a.name&&x.status==='Overdue').length;
 const active=db.orders.filter(x=>x.asset===a.name&&x.status!=='Completed').length;
 let score=100-(breakdowns*12)-(overdue*10)-(active*7)-(a.status==='Stopped'?22:0)-(a.status==='Under Maintenance'?8:0)-(a.criticality==='Critical'?3:0);
 return Math.max(0,Math.min(100,score));
}
function failureRiskPage(){const rows=db.assets.map(a=>{const jobs=db.history.filter(x=>x.asset===a.name||x.asset===a.id),breakdowns=jobs.filter(x=>x.type==='Breakdown').length,overdue=db.pm.filter(x=>x.asset===a.name&&x.status==='Overdue').length,score=assetScore(a);let risk=score<60?'High':score<80||breakdowns>=2||overdue?'Medium':'Low';let reason=[];if(breakdowns)reason.push(`${breakdowns} recorded breakdown(s)`);if(overdue)reason.push(`${overdue} overdue PM task(s)`);if(score<80)reason.push(`health score ${score}/100`);return {a,risk,reason:reason.join(' · ')||'No rule trigger in current local records'};}).sort((x,y)=>({High:0,Medium:1,Low:2}[x.risk]-{High:0,Medium:1,Low:2}[y.risk]));return `${heading('Failure Risk Monitor','Early risk screening from maintenance history and PM status',`<button class="btn ghost small" onclick="setPage('more')">← More</button>`)}<div class="notice">This is a rules-based risk screen, not machine-learning prediction or remaining-useful-life estimation. It does not use live IoT data. Validate with condition monitoring and engineering inspection.</div><div class="cardlist">${rows.map(x=>`<article class="record"><div class="recordhead"><div><h3>${esc(x.a.name)}</h3><p>${esc(x.a.id)} · ${esc(x.a.area)}</p></div>${pill(x.risk)}</div><p>${esc(x.reason)}</p><div class="recordfoot"><span class="meta">Score ${assetScore(x.a)}/100</span><button class="btn secondary small" onclick="createActionWO('${x.a.id}')">Plan inspection</button></div></article>`).join('')}</div>`}
function scoreState(n){return n>=80?['Healthy','#16845b']:n>=60?['Attention','#b7791f']:['Critical','#c24141']}
function reliabilityScorePage(){const rows=db.assets.map(a=>({a,score:assetScore(a)})).sort((x,y)=>x.score-y.score);const avg=rows.length?Math.round(rows.reduce((n,x)=>n+x.score,0)/rows.length):0;return `${heading('Reliability Intelligence Centre','Rules-based asset health scoring · Multi-plant-ready',`<button class="btn ghost small" onclick="setPage('more')">← More</button>`)}<div class="grid"><div class="stat"><div class="stat-top">Average reliability score</div><strong>${avg}/100</strong><small>Based on local maintenance records</small></div><div class="stat"><div class="stat-top">Assets needing attention</div><strong>${rows.filter(x=>x.score<80).length}</strong><small>Score below 80</small></div></div><div class="notice">Indicative score only. It uses recorded breakdowns, overdue PM, open work and asset status. It does not use live sensor data or predict remaining useful life.</div><div class="cardlist">${rows.map(({a,score})=>{const st=scoreState(score);return `<article class="record"><div class="recordhead"><div><h3>${esc(a.name)}</h3><p>${esc(a.id)} · ${esc(a.area)} · ${esc(a.criticality)} criticality</p></div><b style="font-size:23px;color:${st[1]}">${score}</b></div><div class="track" style="height:10px"><div class="fill" style="width:${score}%;background:${st[1]}"></div></div><p>${st[0]} · ${db.history.filter(x=>x.asset===a.name).length} completed jobs · ${db.pm.filter(x=>x.asset===a.name&&x.status==='Overdue').length} overdue PM</p><div class="recordfoot"><button class="btn secondary small" onclick="openTwin('${a.id}')">Equipment twin</button><button class="btn ghost small" onclick="createActionWO('${a.id}')">Create inspection WO</button></div></article>`}).join('')}</div>`}
function componentList(a){const presets={Pump:['Motor','DE Bearing','NDE Bearing','Mechanical Seal','Impeller','Casing','Coupling'],Conveyor:['Drive Motor','Gearbox','Head Pulley','Tail Pulley','Belt','Idlers','Take-up'],Screen:['Exciter','Drive Motor','Screen Deck','Springs','Bearings','Structure'],Gearbox:['Input Shaft','Output Shaft','Bearings','Gears','Lubrication System'],Compressor:['Motor','Air End','Coupling','Oil System','Cooler']};return db.assetComponents[a.id]||presets[a.category]||['Motor / Drive','Gearbox / Transmission','Bearings','Coupling','Structure / Foundation']}
function digitalTwinPage(){const rows=db.assets.filter(a=>(a.name+' '+a.id+' '+a.area).toLowerCase().includes(query.toLowerCase()));return `${heading('Digital Equipment Twin','Equipment hierarchy, component passport and QR-ready asset identity',`<button class="btn ghost small" onclick="setPage('more')">← More</button>`)}<div class="notice">Each passport links equipment identity, components, maintenance history, work orders and SAP reference. QR-ready payload is provided for printing or encoding with your approved QR tool.</div><div class="toolbar"><input class="search" placeholder="Search asset or functional area…" value="${esc(query)}" oninput="query=this.value;render()"></div><div class="cardlist">${rows.map(a=>`<article class="record"><div class="recordhead"><div><h3>${esc(a.name)}</h3><p>${esc(a.id)} · ${esc(a.category)} · ${esc(a.area)}</p></div>${pill(a.status)}</div><p>Criticality: <b>${esc(a.criticality)}</b> · Run hours: ${esc(a.hours)}</p><div class="recordfoot"><span class="meta">${componentList(a).length} component nodes</span><button class="btn secondary small" onclick="openTwin('${a.id}')">Open equipment passport</button></div></article>`).join('')}</div>`}
function openTwin(id){const a=db.assets.find(x=>x.id===id);if(!a)return;const comps=componentList(a);const payload=JSON.stringify({assetId:a.id,name:a.name,plant:sapConfig.plants.split(',')[0]||'1202'});showModal('Equipment passport',`<div class="panel"><div style="font-size:22px;font-weight:800;color:var(--navy)">${esc(a.name)}</div><p>${esc(a.id)} · ${esc(a.category)} · ${esc(a.area)}</p><p>Criticality: ${esc(a.criticality)} · Status: ${esc(a.status)} · Reliability score: <b>${assetScore(a)}/100</b></p><h3>Component hierarchy</h3>${comps.map((c,i)=>`<div class="rowitem"><span>${i+1}. ${esc(c)}</span><span class="meta">Component node</span></div>`).join('')}<h3>Maintenance snapshot</h3><p>Open work orders: ${db.orders.filter(x=>x.asset===a.name&&x.status!=='Completed').length} · Completed jobs: ${db.history.filter(x=>x.asset===a.name).length}</p><label class="meta">QR payload (copy into approved QR generator)</label><textarea id="twinPayload" rows="3" readonly>${esc(payload)}</textarea><button class="btn secondary" onclick="copyTwinPayload()">Copy QR payload</button><button class="btn ghost" onclick="window.print()">Print passport</button></div>`)}
function copyTwinPayload(){const x=document.getElementById('twinPayload');x.select();document.execCommand('copy');alert('Equipment passport payload selected/copied where supported.')}
function aiEngineerPage(){return `${heading('AI Maintenance Engineer','Rule-based engineering helper · Validate every recommendation on site',`<button class="btn ghost small" onclick="setPage('more')">← More</button>`)}<div class="panel"><div class="field"><label>Select equipment</label><select id="aiAsset">${db.assets.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Describe symptom or question</label><textarea id="aiQuestion" rows="3" placeholder="e.g. Slurry pump DE bearing vibration is increasing and temperature is high"></textarea></div><button class="btn" onclick="askMaintenX()">Analyse symptoms</button></div><div id="aiAnswer" class="section"></div><div class="notice">This prototype uses transparent keyword-based guidance, not a connected generative AI model. It does not replace OEM manuals, engineering judgement, isolation or safety procedures.</div>`}
function askMaintenX(){const q=(document.getElementById('aiQuestion').value||'').toLowerCase(),id=document.getElementById('aiAsset').value,a=db.assets.find(x=>x.id===id);let topics=[];if(/vibrat|noise|fft/.test(q))topics.push('Check foundation/hold-down bolts, coupling alignment, soft foot, bearing condition and lubrication. Capture H/V/axial readings at repeatable measurement points and compare against machine-specific limits.');if(/temper|hot|overheat/.test(q))topics.push('Verify sensor validity, lubrication quantity/condition, bearing fit/clearance, load and cooling/ventilation. Compare DE and NDE trends.');if(/leak|seal/.test(q))topics.push('Inspect seal flush/quench arrangement, gland condition, shaft sleeve wear, suction conditions and dry-running history.');if(/press|flow|cavitat|suction/.test(q))topics.push('Check suction strainer, air ingress, NPSH margin, valve position, slurry density and impeller wear. Compare suction/discharge pressure and flow with baseline.');if(/belt|conveyor|track/.test(q))topics.push('Inspect pulley alignment, idler seizure, material build-up, loading point, belt tension and splice condition.');if(/gear|oil|lubric/.test(q))topics.push('Check oil level/grade/viscosity, contamination, breather, filter, oil pressure, backlash and gear contact pattern per OEM procedure.');if(!topics.length)topics=['Collect operating conditions, recent trend readings, alarm history, maintenance history and photographs. Compare against OEM limits and a known-good baseline before concluding a cause.'];const out=document.getElementById('aiAnswer');out.innerHTML=`<div class="panel"><h3>MaintenX engineering guidance · ${esc(a?.name||id)}</h3><ol>${topics.map(t=>`<li style="margin:8px 0">${esc(t)}</li>`).join('')}</ol><p><b>Next step:</b> Record measured values and create an inspection work order if abnormality is confirmed.</p><button class="btn secondary" onclick="createActionWO('${id}')">Create inspection work order</button></div>`}
function visualInspectionPage(){const rows=db.inspections.slice().reverse();return `${heading('Visual Inspection','Photo-backed defect register · Human verification required',`<button class="btn small" onclick="openVisualInspection()">＋ New inspection</button>`)}<div class="notice">Image AI is not connected in this prototype. Record visible observations and have a competent inspector verify severity and disposition.</div><div class="cardlist">${rows.map(x=>`<article class="record"><div class="recordhead"><div><h3>${esc(x.defect)}</h3><p>${esc(x.asset)} · ${esc(x.date)}</p></div>${pill(x.severity)}</div><p>${esc(x.observation)}</p>${x.photo?`<img src="${x.photo}" style="max-width:100%;max-height:180px;border-radius:10px">`:''}<div class="meta">Inspector: ${esc(x.inspector)} · Status: ${esc(x.status)}</div></article>`).join('')||'<div class="panel empty">No visual inspections recorded yet.</div>'}</div>`}
function openVisualInspection(){showModal('New visual inspection',`<form onsubmit="saveVisualInspection(event)"><div class="formgrid"><div class="field full"><label>Equipment</label><select name="asset">${db.assets.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Defect category</label><select name="defect"><option>Crack</option><option>Corrosion</option><option>Leakage</option><option>Wear</option><option>Loose / missing fastener</option><option>Misalignment</option><option>Other</option></select></div><div class="field"><label>Severity (inspector assessed)</label><select name="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div><div class="field full"><label>Observation</label><textarea name="observation" required></textarea></div><div class="field"><label>Inspector</label><input name="inspector" required></div><div class="field"><label>Photo</label><input name="photo" type="file" accept="image/*"></div></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save inspection</button></div></form>`)}

function saveRCA(e){e.preventDefault();const f=new FormData(e.target);db.rcaCases.push({id:'RCA-'+Date.now(),asset:f.get('asset'),failure:f.get('failure'),evidence:f.get('evidence'),cause:f.get('cause'),action:f.get('action'),owner:f.get('owner'),verify:f.get('verify'),date:v17Today(),status:'Open'});save();closeModal();render()}

function shiftHandoverPage(){const open=db.orders.filter(x=>x.status!=='Completed'),overdue=db.pm.filter(x=>x.status==='Overdue'),safety=db.safety.filter(x=>x.status!=='Completed');const recent=db.history.slice(0,5);return `${heading('Smart Shift Handover','Auto-compiled shift summary with editable handover notes',`<button class="btn ghost small" onclick="setPage('more')">← More</button>`)}<div class="panel"><div class="grid"><div class="stat"><strong>${open.length}</strong><small>Open / in-progress jobs</small></div><div class="stat"><strong>${overdue.length}</strong><small>Overdue PM</small></div><div class="stat"><strong>${safety.length}</strong><small>Open safety actions</small></div><div class="stat"><strong>${db.inspections.filter(x=>x.status==='Awaiting review').length}</strong><small>Inspection reviews</small></div></div><h3>Open maintenance jobs</h3>${open.map(x=>`<div class="rowitem"><span>${esc(x.asset)} · ${esc(x.title)}</span>${pill(x.status)}</div>`).join('')||'<p>No open jobs.</p>'}<h3>Overdue PM and safety</h3>${overdue.map(x=>`<p>PM: ${esc(x.asset)} · ${esc(x.task)}</p>`).join('')}${safety.map(x=>`<p>Safety: ${esc(x.area)} · ${esc(x.task)}</p>`).join('')}<h3>Recent completed jobs</h3>${recent.map(x=>`<p>${esc(x.asset)} · ${esc(x.title)} (${esc(x.completedAt||x.date)})</p>`).join('')}</div><div class="section panel"><h3>Shift notes</h3><textarea id="shiftNote" rows="3" placeholder="Operating condition, pending isolation, production constraints, abnormal observations…"></textarea><button class="btn" onclick="saveShiftNote()">Save handover note</button><button class="btn secondary" onclick="window.print()">Print handover</button>${db.shiftNotes.slice(-5).reverse().map(x=>`<p class="meta">${esc(x.date)} · ${esc(x.note)}</p>`).join('')}</div>`}

function moduleHistoryRecords(key){
 const norm=(arr,type,mapper)=>arr.map((x,i)=>({id:x.id||type+'-'+(i+1),title:mapper.title(x),date:mapper.date(x)||'',asset:mapper.asset(x)||'—',status:mapper.status(x)||'Recorded',technician:mapper.technician(x)||'—',type:mapper.type?mapper.type(x):type,detail:mapper.detail?mapper.detail(x):'',raw:x}));
 const common={title:x=>x.title||x.task||x.name||x.failure||x.defect||x.asset||'Record',date:x=>x.completedAt||x.date||x.due||'',asset:x=>x.asset||x.area||x.name||'',status:x=>x.status||x.severity||'Recorded',technician:x=>x.assigned||x.person||x.inspector||x.owner||'',detail:x=>x.remarks||x.note||x.observation||x.cause||''};
 switch(key){
 case 'pm':case 'weekly':case 'monthly':return norm((db.pm||[]).filter(x=>key==='pm'||String(x.frequency||'').toLowerCase()===key), 'Preventive maintenance', {title:x=>x.task,date:x=>x.completedAt||x.due,asset:x=>x.asset,status:x=>x.status,technician:x=>x.assigned||x.completedBy,type:x=>x.frequency,detail:x=>x.remarks||'Frequency: '+(x.frequency||'—')});
 case 'safety':return norm(db.safety||[],'Safety action',{title:x=>x.task,date:x=>x.completedAt||x.date||x.due,asset:x=>x.area,status:x=>x.status,technician:x=>x.assigned,type:x=>x.hazard,detail:x=>x.remarks||x.hazard});
 case 'scrubber':case 'reliability':return norm(db.scrubberReadings||[],'Scrubber reading',{title:x=>'Scrubber condition reading · '+(x.shift||''),date:x=>x.date,asset:x=>'Scrubber',status:x=>x.status,technician:x=>x.person,type:x=>'Vibration inspection',detail:x=>x.remarks||`${x.rpm||'—'} RPM · ${x.current||'—'} A`});
 case 'pumpReliability':return norm(db.pumpReadings||[],'Pump inspection',{title:x=>'Slurry pump inspection',date:x=>x.date,asset:x=>x.asset||'Slurry Pump',status:x=>x.status,technician:x=>x.person,type:x=>'Condition monitoring',detail:x=>x.remarks});
 case 'millReliability':return norm(db.millReadings||[],'Ball mill inspection',{title:x=>'Ball mill inspection',date:x=>x.date,asset:x=>x.asset||'Ball Mill',status:x=>x.status,technician:x=>x.person,type:x=>'Condition monitoring',detail:x=>x.remarks});
 case 'visualInspection':return norm(db.inspections||[],'Visual inspection',{title:x=>x.defect,date:x=>x.date,asset:x=>x.asset,status:x=>x.status||x.severity,technician:x=>x.inspector,type:x=>x.severity,detail:x=>x.observation});
 case 'rca':return norm(db.rcaCases||[],'RCA case',{title:x=>x.failure,date:x=>x.date,asset:x=>x.asset,status:x=>x.status,technician:x=>x.owner,type:x=>'Root cause analysis',detail:x=>x.cause+' · '+x.action});
 case 'costIntel':return norm(db.costEntries||[],'Cost record',{title:x=>'Maintenance cost entry',date:x=>x.date,asset:x=>x.asset,status:x=>'Recorded',technician:x=>x.enteredBy,type:x=>'Cost record',detail:x=>`Material ₹${x.material||0} · Service ₹${x.service||0} · Labour ₹${x.labour||0} · ${x.note||''}`});
 case 'shiftHandover':return norm(db.shiftNotes||[],'Shift handover',{title:x=>'Shift handover note',date:x=>x.date,asset:x=>x.area||'Plant handover',status:x=>x.status||'Saved',technician:x=>x.person||x.author,type:x=>x.shift||'Handover',detail:x=>x.note});
 case 'spares':case 'sparePredictor':return norm(db.spares||[],'Spare part snapshot',{title:x=>x.name,date:x=>x.updatedAt||'',asset:x=>x.location,status:x=>x.stock<=x.min?'Low Stock':'Available',technician:x=>x.updatedBy,type:x=>x.part,detail:x=>`Part ${x.part} · Stock ${x.stock} ${x.unit} · Minimum ${x.min}`});
 case 'sap':return norm(sapLiveRecords||[],'SAP record',{title:x=>x.name||x.id,date:x=>x.date||x.changedOn||'',asset:x=>x.plantName||x.plant,status:x=>x.status||'Read-only',technician:x=>x.changedBy||'',type:x=>x.kind||'SAP object',detail:x=>x.detail||'Read-only SAP snapshot'});
 case 'assets':case 'digitalTwin':case 'reliabilityScore':case 'failureRisk':case 'actionCentre':return norm(db.assets||[],'Equipment record',{title:x=>x.name,date:x=>x.updatedAt||'',asset:x=>x.area,status:x=>x.status,technician:x=>x.owner,type:x=>x.category,detail:x=>`Asset ${x.id} · ${x.criticality} criticality · Reliability score ${assetScore(x)}/100`});
 case 'calendar':return norm(db.pm||[],'Calendar task',{title:x=>x.task,date:x=>x.due,asset:x=>x.asset,status:x=>x.status,technician:x=>x.assigned,type:x=>x.frequency,detail:x=>'Scheduled maintenance'});
 case 'aiEngineer':return norm(db.aiConversations||[],'AI engineering session',{title:x=>x.title||'Engineering question',date:x=>x.date,asset:x=>x.asset,status:x=>x.status||'Saved',technician:x=>x.user,type:x=>'AI assistance',detail:x=>x.summary||x.question});
 default:return norm([], 'Module record',common);
 }
}

function v15SetTab(t){v15Tab=t;render()}
function v15Page(){
 const tabs=[['overview','Overview'],['master','Equipment master'],['approvals','Approvals'],['quality','Job quality'],['actions','Escalations'],['drawings','Drawing revisions'],['compat','Spare compatibility'],['shutdown','Shutdown planning'],['benchmark','Plant benchmarking'],['audit','Audit trail']];
 const content=v15Tab==='overview'?v15Overview():v15Tab==='master'?v15Master():v15Tab==='approvals'?v15Approvals():v15Tab==='quality'?v15Quality():v15Tab==='actions'?v15Actions():v15Tab==='drawings'?v15Drawings():v15Tab==='compat'?v15Compat():v15Tab==='shutdown'?v15Shutdown():v15Tab==='benchmark'?v15Benchmark():v15Audit();
 return `${heading('Enterprise Governance & Intelligence','MaintenX v26 · Shared equipment identity, controlled decisions and auditable maintenance execution',`<button class="btn ghost small" onclick="setPage('more')">← More</button>`)}<div class="notice"><b>v15 data layer:</b> these records are stored locally in this browser and bridge selected MaintenX records through a common equipment ID. This is not yet a central multi-user database or a live SAP write integration.</div><div class="v15-tabs">${tabs.map(([k,n])=>`<button class="${v15Tab===k?'active':''}" onclick="v15SetTab('${k}')">${n}</button>`).join('')}</div>${content}`;
}
function v15Card(title,body,action=''){return `<div class="panel"><div class="section-title"><h2>${title}</h2>${action}</div>${body}</div>`}
function v15Overview(){
 const pending=v15Data.approvals.filter(x=>x.status==='Pending').length,open=v15Data.actions.filter(x=>x.status!=='Closed').length,late=v15Data.actions.filter(x=>x.status!=='Closed'&&x.due&&x.due<v17Today()).length;
 const q=v15Search.toLowerCase();const eq=v15Data.equipment.filter(x=>(v15Plant==='All'||x.plant===v15Plant)&&(!q||(x.id+' '+x.name+' '+x.area+' '+x.plant).toLowerCase().includes(q)));
 const plants=[...new Set(v15Data.equipment.map(x=>x.plant).filter(Boolean))];
 return `<div class="v15-grid"><div class="v15-kpi"><small>Shared equipment</small><b>${v15Data.equipment.length}</b></div><div class="v15-kpi"><small>Pending approvals</small><b>${pending}</b></div><div class="v15-kpi"><small>Open escalations</small><b>${open}</b></div><div class="v15-kpi"><small>Overdue actions</small><b style="color:var(--red)">${late}</b></div><div class="v15-kpi"><small>Drawing register</small><b>${v15Data.drawings.length}</b></div><div class="v15-kpi"><small>Audit events</small><b>${v15Data.audit.length}</b></div></div>
 ${v15Card('Cross-module equipment intelligence',`<div class="toolbar"><input class="search" placeholder="Search equipment ID, name or area" value="${esc(v15Search)}" oninput="v15Search=this.value;render()"><select class="filter" onchange="v15Plant=this.value;render()"><option>All</option>${plants.map(p=>`<option ${v15Plant===p?'selected':''}>${esc(p)}</option>`).join('')}</select><button class="btn small" onclick="v15SetTab('master')">Open master</button></div><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Equipment</th><th>Plant / area</th><th>Category</th><th>Criticality</th><th>Linked records</th></tr></thead><tbody>${eq.slice(0,30).map(x=>`<tr><td><b>${esc(x.id)}</b><br>${esc(x.name)}</td><td>${esc(x.plant)}<br>${esc(x.area)}</td><td>${esc(x.category)}</td><td>${pill(x.criticality)}</td><td>${v15LinkedCount(x.id)} records <button class="btn secondary small" onclick="v15EquipmentDetail('${esc(x.id)}')">View</button></td></tr>`).join('')||'<tr><td colspan="5">No matching equipment records.</td></tr>'}</tbody></table></div>`)}
 ${v15Card('Governance workflow',`<p class="muted">Technical recommendations, job quality checks, drawing revision status, spare compatibility decisions and shutdown dependencies are managed in the tabs above. Each saved action is recorded in the audit trail.</p><div class="v15-actions"><button class="btn" onclick="v15SetTab('approvals')">Review approvals</button><button class="btn secondary" onclick="v15SetTab('actions')">Review escalations</button><button class="btn secondary" onclick="v15SetTab('audit')">Open audit trail</button></div>`)} `;
}
function v15LinkedCount(id){return (db.orders||[]).filter(x=>v16Match(x.asset,id)).length+(db.pm||[]).filter(x=>v16Match(x.asset,id)).length+(db.history||[]).filter(x=>v16Match(x.asset,id)).length+v15Data.qualityJobs.filter(x=>v16Match(x.asset,id)).length+v15Data.actions.filter(x=>v16Match(x.asset,id)).length}
function v15Master(){return `${v15Card('Shared equipment master',`<p class="v15-muted">Common identity register seeded from the MaintenX equipment register. Use the same equipment ID across orders, drawings, approvals and shutdown tasks.</p><div class="v15-actions"><button class="btn" onclick="v15EquipmentForm()">＋ Add equipment</button><button class="btn secondary" onclick="v15Export('equipment')">Export CSV</button></div><div class="v15-scroll"><table class="v15-table"><thead><tr><th>ID</th><th>Name</th><th>Plant</th><th>Area</th><th>Criticality</th><th>Owner</th></tr></thead><tbody>${v15Data.equipment.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.name)}</td><td>${esc(x.plant)}</td><td>${esc(x.area)}</td><td>${esc(x.criticality)}</td><td>${esc(x.owner||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No equipment registered.</td></tr>'}</tbody></table></div>`)} `}
function v15EquipmentForm(){showModal('Add shared equipment',`<form onsubmit="v15SaveEquipment(event)"><div class="field"><label>Equipment ID *</label><input name="id" required></div><div class="field"><label>Equipment name *</label><input name="name" required></div><div class="v15-formgrid"><div class="field"><label>Plant</label><input name="plant" value="Plant 1202"></div><div class="field"><label>Area</label><input name="area"></div><div class="field"><label>Category</label><input name="category"></div><div class="field"><label>Criticality</label><select name="criticality"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Owner</label><input name="owner"></div><div class="field"><label>Status</label><select name="status"><option>Active</option><option>Standby</option><option>Out of service</option></select></div></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save equipment</button></div></form>`)}
function v15SaveEquipment(e){e.preventDefault();const f=new FormData(e.target),id=String(f.get('id')).trim();if(v15Data.equipment.some(x=>x.id===id)){alert('Equipment ID already exists.');return}v15Data.equipment.push({id,name:f.get('name'),plant:f.get('plant'),area:f.get('area'),category:f.get('category'),criticality:f.get('criticality'),owner:f.get('owner'),status:f.get('status'),source:'v15'});v15Log('Created equipment master',id,'Added to shared equipment register');closeModal();v15SetTab('master')}
function v15EquipmentDetail(id){const x=v15Data.equipment.find(z=>z.id===id);const related=[...(db.orders||[]).filter(z=>v16Match(z.asset,id)).map(z=>({type:'Work order',title:z.title||z.task||z.id,status:z.status})),...(db.pm||[]).filter(z=>v16Match(z.asset,id)).map(z=>({type:'PM',title:z.task,status:z.status})),...v15Data.approvals.filter(z=>v16Match(z.asset,id)).map(z=>({type:'Approval',title:z.title,status:z.status})),...v15Data.drawings.filter(z=>v16Match(z.asset,id)).map(z=>({type:'Drawing',title:z.title,status:z.revision+' · '+z.status})),...v15Data.qualityJobs.filter(z=>v16Match(z.asset,id)).map(z=>({type:'Quality check',title:z.job,status:z.score+'/100'}))];showModal('Equipment intelligence',`<p><b>${esc(x.name)}</b><br>${esc(x.id)} · ${esc(x.plant)} · ${esc(x.area)}</p><p>Criticality: ${esc(x.criticality)} · Owner: ${esc(x.owner||'—')}</p><h3>Linked records (${related.length})</h3>${related.map(r=>`<div class="notice"><b>${esc(r.type)}:</b> ${esc(r.title)} <span class="pill">${esc(r.status||'Recorded')}</span></div>`).join('')||'<p class="muted">No linked records yet.</p>'}<div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function v15Approvals(){return `${v15Card('Engineering approval queue',`<p class="v15-muted">Approvals are demo workflow records. Production authorization must be enforced by a server-side role and permission system.</p><button class="btn" onclick="v15ApprovalForm()">＋ Submit for approval</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Request</th><th>Equipment</th><th>Requested by</th><th>Approver</th><th>Status</th><th>Decision</th></tr></thead><tbody>${v15Data.approvals.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.type)}</small></td><td>${esc(x.asset)}</td><td>${esc(x.requester)}</td><td>${esc(x.approver)}</td><td>${pill(x.status)}</td><td>${x.status==='Pending'?`<button class="btn small" onclick="v15Decide('${x.id}','Approved')">Approve</button> <button class="btn danger small" onclick="v15Decide('${x.id}','Rejected')">Reject</button>`:esc(x.decisionNote||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No approval requests.</td></tr>'}</tbody></table></div>`)} `}
function v15ApprovalForm(){showModal('Submit engineering approval',`<form onsubmit="v15SaveApproval(event)"><div class="field"><label>Request title *</label><input name="title" required></div><div class="v15-formgrid"><div class="field"><label>Equipment ID</label><input name="asset" list="v15assetlist"><datalist id="v15assetlist">${v15Data.equipment.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</datalist></div><div class="field"><label>Approval type</label><select name="type"><option>Technical recommendation</option><option>Shutdown scope</option><option>Spare substitute</option><option>Drawing revision</option><option>Repair / replacement</option><option>Job quality closure</option></select></div><div class="field"><label>Requested by</label><input name="requester" required></div><div class="field"><label>Approver role</label><select name="approver"><option>Maintenance Engineer</option><option>Maintenance Head</option><option>Safety Officer</option><option>Plant Manager</option></select></div></div><div class="field"><label>Evidence / justification</label><textarea name="evidence"></textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Submit request</button></div></form>`)}
function v15SaveApproval(e){e.preventDefault();const f=new FormData(e.target),x={id:'APR-'+Date.now(),title:f.get('title'),asset:f.get('asset'),type:f.get('type'),requester:f.get('requester'),approver:f.get('approver'),evidence:f.get('evidence'),status:'Pending',createdAt:new Date().toISOString(),decisionNote:''};v15Data.approvals.unshift(x);v15Log('Submitted approval',x.id,x.title);closeModal();v15SetTab('approvals')}
function v15Decide(id,decision){const x=v15Data.approvals.find(a=>a.id===id);if(!x||x.status!=='Pending')return;const note=prompt('Decision note / evidence (required):');if(note===null||!note.trim())return;x.status=decision;x.decisionNote=note.trim();x.decidedAt=new Date().toISOString();x.decidedBy=document.getElementById('role')?.value||'Demo approver';v15Log(decision+' approval',id,note);v15Save();render()}
function v15Quality(){return `${v15Card('Maintenance job quality verification',`<p class="v15-muted">Checklist scoring is a configurable quality aid, not a substitute for OEM procedures, commissioning checks or competent-person sign-off.</p><button class="btn" onclick="v15QualityForm()">＋ Record quality check</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Job</th><th>Equipment</th><th>Inspector</th><th>Score</th><th>Result</th><th>Date</th></tr></thead><tbody>${v15Data.qualityJobs.map(x=>`<tr><td>${esc(x.job)}</td><td>${esc(x.asset)}</td><td>${esc(x.inspector)}</td><td><b>${x.score}/100</b></td><td>${pill(x.result)}</td><td>${esc(x.date)}</td></tr>`).join('')||'<tr><td colspan="6">No quality checks recorded.</td></tr>'}</tbody></table></div>`)} `}
function v15QualityForm(){showModal('Job quality verification',`<form onsubmit="v15SaveQuality(event)"><div class="field"><label>Job / work order *</label><input name="job" required></div><div class="v15-formgrid"><div class="field"><label>Equipment ID</label><input name="asset" list="v15assetlist"><datalist id="v15assetlist">${v15Data.equipment.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</datalist></div><div class="field"><label>Inspector</label><input name="inspector" required></div></div><p><label><input type="checkbox" name="procedure" checked> Work followed approved procedure</label></p><p><label><input type="checkbox" name="spare" checked> Correct spare / material verified</label></p><p><label><input type="checkbox" name="measure" checked> Clearances / alignment / measurements recorded</label></p><p><label><input type="checkbox" name="evidence"> Photographic evidence attached / referenced</label></p><p><label><input type="checkbox" name="trial"> Trial run and handover completed</label></p><div class="field"><label>Comments / evidence reference</label><textarea name="note"></textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save quality check</button></div></form>`)}
function v15SaveQuality(e){e.preventDefault();const f=new FormData(e.target),keys=['procedure','spare','measure','evidence','trial'],score=Math.round(keys.filter(k=>f.has(k)).length/keys.length*100),x={id:'QC-'+Date.now(),job:f.get('job'),asset:f.get('asset'),inspector:f.get('inspector'),score,result:score===100?'Verified':score>=60?'Needs review':'Incomplete',date:v17Today(),note:f.get('note'),checks:Object.fromEntries(keys.map(k=>[k,f.has(k)]))};v15Data.qualityJobs.unshift(x);v15Log('Recorded job quality check',x.id,score+'/100 · '+x.job);if(score<100)v15Data.actions.unshift({id:'ACT-'+Date.now(),title:'Complete outstanding job quality checks',asset:x.asset,owner:x.inspector,due:v17Today(),priority:'Medium',status:'Open',source:'Quality check'});closeModal();v15SetTab('quality')}
function v15Actions(){const derived=[...(db.pm||[]).filter(x=>x.status==='Overdue').map(x=>({id:'PM-'+x.id,title:'Overdue PM: '+x.task,asset:x.asset,owner:x.assigned,due:x.due,priority:'High',status:'Open',source:'PM'})),...(db.orders||[]).filter(x=>x.status==='Open'&&x.priority==='Critical').map(x=>({id:'WO-'+x.id,title:'Critical work order: '+(x.title||x.task||x.id),asset:x.asset,owner:x.assigned,due:x.due,priority:'Critical',status:'Open',source:'Work order'})),...v15Data.actions];return `${v15Card('Escalation and action register',`<p class="v15-muted">Derived PM and critical work-order alerts are read-only indicators. Manually logged actions can be assigned and closed here. Escalation timing is configurable per plant policy; this demo does not send notifications.</p><button class="btn" onclick="v15ActionForm()">＋ Add action</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Action</th><th>Equipment</th><th>Owner</th><th>Due</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>${derived.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.source)}</small></td><td>${esc(x.asset||'—')}</td><td>${esc(x.owner||'—')}</td><td>${esc(x.due||'—')}</td><td>${pill(x.priority)}</td><td>${pill(x.status)}</td><td>${v15Data.actions.some(a=>a.id===x.id)?`<button class="btn small" onclick="v15CloseAction('${x.id}')">Close</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">No open escalation items.</td></tr>'}</tbody></table></div>`)} `}
function v15ActionForm(){showModal('Add escalation action',`<form onsubmit="v15SaveAction(event)"><div class="field"><label>Action *</label><input name="title" required></div><div class="v15-formgrid"><div class="field"><label>Equipment ID</label><input name="asset"></div><div class="field"><label>Owner</label><input name="owner" required></div><div class="field"><label>Due date</label><input name="due" type="date"></div><div class="field"><label>Priority</label><select name="priority"><option>Low</option><option>Medium</option><option selected>High</option><option>Critical</option></select></div></div><div class="field"><label>Escalation rule / source</label><input name="source" value="Manual action"></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save action</button></div></form>`)}
function v15SaveAction(e){e.preventDefault();const f=new FormData(e.target),x={id:'ACT-'+Date.now(),title:f.get('title'),asset:f.get('asset'),owner:f.get('owner'),due:f.get('due'),priority:f.get('priority'),source:f.get('source'),status:'Open'};v15Data.actions.unshift(x);v15Log('Created escalation action',x.id,x.title);closeModal();v15SetTab('actions')}
function v15CloseAction(id){const x=v15Data.actions.find(a=>a.id===id);if(x){x.status='Closed';x.closedAt=new Date().toISOString();v15Log('Closed action',id,x.title);v15Save();render()}}
function v15Drawings(){return `${v15Card('Engineering drawing vault · revision control',`<p class="v15-muted">Register document metadata and revision status. Actual files remain in your approved document repository; this browser prototype does not provide secure file storage or electronic document approval.</p><button class="btn" onclick="v15DrawingForm()">＋ Register drawing</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Drawing</th><th>Equipment</th><th>Revision</th><th>Status</th><th>Approved by</th><th>Updated</th></tr></thead><tbody>${v15Data.drawings.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.number)}</small></td><td>${esc(x.asset)}</td><td>${esc(x.revision)}</td><td>${pill(x.status)}</td><td>${esc(x.approvedBy||'—')}</td><td>${esc(x.date)}</td></tr>`).join('')||'<tr><td colspan="6">No drawing records registered.</td></tr>'}</tbody></table></div>`)} `}
function v15DrawingForm(){showModal('Register drawing revision',`<form onsubmit="v15SaveDrawing(event)"><div class="field"><label>Drawing title *</label><input name="title" required></div><div class="v15-formgrid"><div class="field"><label>Drawing number</label><input name="number"></div><div class="field"><label>Equipment ID</label><input name="asset"></div><div class="field"><label>Revision</label><input name="revision" required></div><div class="field"><label>Status</label><select name="status"><option>Draft</option><option>Under review</option><option>Approved</option><option>Obsolete</option></select></div><div class="field"><label>Approved by</label><input name="approvedBy"></div><div class="field"><label>Document reference / URL</label><input name="ref" placeholder="Approved repository reference"></div></div><div class="field"><label>Revision notes</label><textarea name="note"></textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save revision</button></div></form>`)}
function v15SaveDrawing(e){e.preventDefault();const f=new FormData(e.target),x={id:'DRW-'+Date.now(),title:f.get('title'),number:f.get('number'),asset:f.get('asset'),revision:f.get('revision'),status:f.get('status'),approvedBy:f.get('approvedBy'),ref:f.get('ref'),note:f.get('note'),date:v17Today()};if(x.status==='Approved')v15Data.drawings.filter(d=>d.number===x.number&&d.status==='Approved').forEach(d=>d.status='Superseded');v15Data.drawings.unshift(x);v15Log('Registered drawing revision',x.id,x.number+' Rev '+x.revision+' '+x.status);closeModal();v15SetTab('drawings')}
function v15Compat(){return `${v15Card('Spare interchangeability · engineering compatibility review',`<p class="v15-muted">Compare key specifications before proposing a substitute. A match is only a screening result; engineering approval and OEM / standards verification are mandatory before use.</p><button class="btn" onclick="v15CompatForm()">＋ Compare substitute</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Original part</th><th>Proposed part</th><th>Comparison</th><th>Result</th><th>Approval</th></tr></thead><tbody>${v15Data.compatibility.map(x=>`<tr><td>${esc(x.original)}</td><td>${esc(x.proposed)}</td><td>${esc(x.summary)}</td><td>${pill(x.result)}</td><td>${esc(x.approval)}</td></tr>`).join('')||'<tr><td colspan="5">No compatibility reviews.</td></tr>'}</tbody></table></div>`)} `}
function v15CompatForm(){showModal('Spare compatibility screening',`<form onsubmit="v15SaveCompat(event)"><div class="v15-formgrid"><div class="field"><label>Original part *</label><input name="original" required></div><div class="field"><label>Proposed substitute *</label><input name="proposed" required></div>${[['Bore / ID','bore'],['Outer diameter','od'],['Width / length','width'],['Load rating','load'],['Speed / RPM','rpm'],['Seal / material type','material']].map(([l,n])=>`<div class="field"><label>${l} · Original</label><input name="${n}1"></div><div class="field"><label>${l} · Substitute</label><input name="${n}2"></div>`).join('')}</div><div class="field"><label>Engineering notes</label><textarea name="note"></textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save screening</button></div></form>`)}
function v15SaveCompat(e){e.preventDefault();const f=new FormData(e.target),keys=['bore','od','width','load','rpm','material'],matches=keys.filter(k=>String(f.get(k+'1')||'').trim()&&String(f.get(k+'1')).trim()===String(f.get(k+'2')||'').trim()).length,filled=keys.filter(k=>String(f.get(k+'1')||'').trim()||String(f.get(k+'2')||'').trim()).length,result=filled===0?'Insufficient data':matches===filled?'Screening match':'Differences / incomplete';const x={id:'CMP-'+Date.now(),original:f.get('original'),proposed:f.get('proposed'),summary:matches+'/'+filled+' entered specification pairs match',result,approval:'Pending engineer approval',note:f.get('note'),specs:Object.fromEntries(keys.map(k=>[k,[f.get(k+'1'),f.get(k+'2')]]))};v15Data.compatibility.unshift(x);v15Data.approvals.unshift({id:'APR-'+Date.now(),title:'Approve spare substitute: '+x.proposed,asset:'',type:'Spare substitute',requester:'Compatibility screening',approver:'Maintenance Engineer',evidence:x.summary+' · '+(x.note||''),status:'Pending',createdAt:new Date().toISOString()});v15Log('Screened spare compatibility',x.id,x.summary);closeModal();v15SetTab('compat')}
function v15Shutdown(){const tasks=[...v15Data.shutdownTasks].sort((a,b)=>(a.start||'').localeCompare(b.start||''));const total=tasks.reduce((a,x)=>a+(+x.duration||0),0);return `${v15Card('Shutdown and turnaround planner',`<div class="v15-grid"><div class="v15-kpi"><small>Activities</small><b>${tasks.length}</b></div><div class="v15-kpi"><small>Planned work hours</small><b>${total}</b></div><div class="v15-kpi"><small>Completed</small><b>${tasks.filter(x=>x.status==='Completed').length}</b></div></div><p class="v15-muted">Dependency IDs are recorded for supervisor review. This prototype does not calculate a validated CPM network or auto-reschedule resources.</p><button class="btn" onclick="v15ShutdownForm()">＋ Add shutdown activity</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Activity</th><th>Equipment</th><th>Duration (h)</th><th>Depends on</th><th>Owner</th><th>Start</th><th>Status</th></tr></thead><tbody>${tasks.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.asset)}</td><td>${esc(x.duration)}</td><td>${esc(x.depends||'—')}</td><td>${esc(x.owner)}</td><td>${esc(x.start)}</td><td>${pill(x.status)}</td></tr>`).join('')||'<tr><td colspan="7">No shutdown activities planned.</td></tr>'}</tbody></table></div>`)} `}
function v15ShutdownForm(){showModal('Add shutdown activity',`<form onsubmit="v15SaveShutdown(event)"><div class="field"><label>Activity *</label><input name="title" required></div><div class="v15-formgrid"><div class="field"><label>Equipment ID</label><input name="asset"></div><div class="field"><label>Duration (hours)</label><input name="duration" type="number" min="0" step="0.5" required></div><div class="field"><label>Depends on activity ID</label><input name="depends"></div><div class="field"><label>Owner / team</label><input name="owner"></div><div class="field"><label>Planned start</label><input name="start" type="date"></div><div class="field"><label>Status</label><select name="status"><option>Planned</option><option>Ready</option><option>In Progress</option><option>Completed</option><option>Blocked</option></select></div></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save activity</button></div></form>`)}

function v15Audit(){return `${v15Card('Activity audit trail',`<p class="v15-muted">This local prototype records v15 workflow actions. Browser-local logs can be edited by a user with device access; production audit integrity requires server-side immutable logging and authenticated identities.</p><button class="btn secondary" onclick="v15Export('audit')">Export audit CSV</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Timestamp</th><th>User / role</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${v15Data.audit.map(x=>`<tr><td>${esc(new Date(x.date).toLocaleString('en-IN'))}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="5">No audit events yet. New v15 actions will appear here.</td></tr>'}</tbody></table></div>`)} `}
function v15Export(key){const rows=v15Data[key]||[];if(!rows.length){alert('No records to export.');return}const cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];const csv=[cols.join(','),...rows.map(x=>cols.map(k=>'"'+String(typeof x[k]==='object'?JSON.stringify(x[k]):x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v17Csv(csv)],{type:'text/csv'}));a.download='MaintenX_v15_'+key+'.csv';a.click();URL.revokeObjectURL(a.href)}

<script>
/* MaintenX v16 upgrades */
//SHA-START
const v16K=[],v16H=[];(()=>{let p=2;for(let n=0;n<64;p++){let ok=true;for(let d=2;d*d<=p;d++)if(p%d===0){ok=false;break}if(ok){if(n<8)v16H[n]=(Math.pow(p,.5)%1)*4294967296|0;v16K[n]=(Math.pow(p,1/3)%1)*4294967296|0;n++}}})();
function v16sha(s){const rr=(v,a)=>(v>>>a)|(v<<(32-a)),b=[...new TextEncoder().encode(s)],l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);let h=v16H.slice();for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+w[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}let[a,c,d,e,f,g,hh,k]=h;for(let i=0;i<64;i++){const t1=(k+(rr(f,6)^rr(f,11)^rr(f,25))+((f&g)^(~f&hh))+v16K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&c)^(a&d)^(c&d)))|0;k=hh;hh=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}h=[h[0]+a|0,h[1]+c|0,h[2]+d|0,h[3]+e|0,h[4]+f|0,h[5]+g|0,h[6]+hh|0,h[7]+k|0]}return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
//SHA-END

function v16Toast(m){let t=document.getElementById('v16toast');if(!t){t=document.createElement('div');t.id='v16toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>{t.className=''},3400)}
function v16Match(a,id){if(a===id)return true;const e=v15Data.equipment.find(z=>z.id===id);return !!e&&a===e.name}

/* Dashboard: live plant name + reliability pulse */
const v16Dash=dashboard;
dashboard=function(){const plant=document.getElementById('plant').value,pm=db.pm||[],over=pm.filter(x=>x.status==='Overdue').length,ok=pm.length?Math.round((pm.length-over)/pm.length*100):100,hi=db.orders.filter(x=>x.status!=='Completed'&&['High','Critical'].includes(x.priority)).length,saf=(db.safety||[]).filter(x=>!['Completed','Closed'].includes(x.status)).length,run=db.assets.filter(x=>x.status==='Running').length,col=ok>=90?'var(--green)':ok>=75?'var(--amber)':'var(--red)';
const k=(ico,label,val,sub,pg,c)=>`<button class="stat" onclick="setPage('${pg}')"><div class="stat-top">${label} <span class="ico">${ico}</span></div><strong style="color:${c}">${val}</strong><small>${sub}</small></button>`;
const pulse=`<section class="section"><div class="section-title"><h2>Reliability pulse</h2></div><div class="grid">${k('◷','PM on schedule',ok+'%',over+' overdue of '+pm.length+' tasks','pm',col)}${k('▲','High-priority open',hi,'Work orders not yet closed','orders',hi?'var(--red)':'var(--green)')}${k('⚑','Open safety items',saf,'Inspections and actions','safety',saf?'var(--amber)':'var(--green)')}${k('⚙','Assets running',run+'/'+db.assets.length,'Registered equipment','assets','var(--navy)')}</div></section>`;
return v16Dash().replace('Cement Plant – Unit 1 · Maintenance overview',esc(plant)+' · Maintenance overview').replace('<section class="section"><div class="section-title"><h2>Quick actions',pulse+'<section class="section"><div class="section-title"><h2>Quick actions')};

/* Backup, restore, sign out */
const v16More=morePage;
morePage=function(){return v16More()+`<section class="section"><div class="section-title"><h2>Data backup</h2></div><div class="panel"><p class="v15-muted">Everything is stored in this browser only. Download a backup before clearing browser data or switching devices.</p><div class="v15-actions"><button class="btn" onclick="v16Backup()">Download backup</button><label class="btn secondary" style="cursor:pointer">Restore backup<input type="file" accept="application/json,.json" hidden onchange="v16Restore(this)"></label><button class="btn ghost" onclick="v16SignOut()">Sign out</button></div></div></section>`};
function v16Backup(){const o={app:'MaintenX',version:16,exportedAt:new Date().toISOString(),data:{}};Object.keys(localStorage).filter(k=>k.startsWith('maintenx_')).forEach(k=>{o.data[k]=localStorage.getItem(k)});v15Log('Exported full backup','Backup',Object.keys(o.data).length+' data sets');o.data.maintenx_v15_enterprise=localStorage.getItem('maintenx_v15_enterprise');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='MaintenX_backup_'+v17Today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);v16Toast('Backup downloaded.')}
function v16Restore(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='MaintenX'||!o.data)throw new Error('bad');if(!confirm('Replace all data in this browser with the backup from '+(o.exportedAt||'an unknown date')+'?'))return;Object.keys(localStorage).filter(k=>k.startsWith('maintenx_')).forEach(k=>localStorage.removeItem(k));Object.keys(o.data).filter(k=>k.startsWith('maintenx_')&&o.data[k]!=null).forEach(k=>localStorage.setItem(k,o.data[k]));location.reload()}catch(e){v16Toast('That file is not a MaintenX backup.')}};r.readAsText(f);input.value=''}
function v16SignOut(){demoEntered=false;loginStep=1;sessionStorage.removeItem('maintenx_demo_entered');render()}

/* Approvals: in-app decision sheet with role check (replaces prompt()) */
function v15Decide(id,decision){const x=v15Data.approvals.find(a=>a.id===id);if(!x||x.status!=='Pending')return;if(!['Engineer','Admin'].includes(document.getElementById('role').value)){v16Toast('Switch to Engineer or Admin to decide approvals.');return}const ok=decision==='Approved';showModal(ok?'Approve request':'Reject request',`<p><b>${esc(x.title)}</b><br><span class="muted">${esc(x.type)} · requested by ${esc(x.requester)}</span></p>${x.evidence?`<div class="notice">${esc(x.evidence)}</div>`:''}<div class="field" style="margin-top:12px"><label>Decision note / evidence *</label><textarea id="v16note"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ${ok?'':'danger'}" onclick="v16ConfirmDecision('${id}','${decision}')">${ok?'Approve':'Reject'}</button></div>`)}
function v16ConfirmDecision(id,decision){const x=v15Data.approvals.find(a=>a.id===id),n=(document.getElementById('v16note').value||'').trim();if(!x||x.status!=='Pending')return;if(!n){v16Toast('Add a decision note first.');return}x.status=decision;x.decisionNote=n;x.decidedAt=new Date().toISOString();x.decidedBy=document.getElementById('role').value;v15Log(decision+' approval',id,n);closeModal();render()}

/* Audit trail: SHA-256 hash chain + verification */
function v15Log(action,entity,detail){const l=v15Data.audit,rec={id:'AUD-'+Date.now(),date:new Date().toISOString(),user:document.getElementById('role')?.value||'Demo user',action,entity,detail};rec.prev=l.length&&l[0].hash?l[0].hash:'GENESIS';rec.hash=v16sha(rec.prev+'|'+JSON.stringify([rec.id,rec.date,rec.user,rec.action,rec.entity,rec.detail]));l.unshift(rec);v15Data.audit=l.slice(0,1000);v15Save()}
function v16Verify(){const l=[...v15Data.audit].reverse().filter(x=>x.hash);let bad=null;l.forEach((x,i)=>{if(bad)return;if(v16sha(x.prev+'|'+JSON.stringify([x.id,x.date,x.user,x.action,x.entity,x.detail]))!==x.hash||(i>0&&x.prev!==l[i-1].hash))bad=x});showModal('Audit chain check',bad?`<div class="notice" style="background:#fff0f0;border-color:#f3c9c9;color:#a52e2e"><b>Chain broken</b> at ${esc(bad.id)} (${esc(bad.action)}, ${esc(new Date(bad.date).toLocaleString('en-IN'))}). An entry was edited, removed or reordered after it was written.</div>`:`<div class="notice"><b>Chain intact.</b> ${l.length} chained entries checked. Entries written before v16 carry no hash and are not covered.</div>`,)+'';document.getElementById('modalBody').insertAdjacentHTML('beforeend','<p class="v15-muted">This detects casual edits. Someone with device access who rebuilds the whole chain could still forge it, so production use needs server-side logging.</p><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>')}
const v16Aud=v15Audit;
v15Audit=function(){return v16Aud().replace(`<button class="btn secondary" onclick="v15Export('audit')">Export audit CSV</button>`,`<button class="btn secondary" onclick="v15Export('audit')">Export audit CSV</button> <button class="btn" onclick="v16Verify()">Verify chain</button>`)};

/* Shutdown planner: critical-path scheduling from picked dependencies */
function v16CPM(tasks){const m=new Map(tasks.map(t=>[t.id,t])),dp=t=>String(t.depends||'').split(',').map(s=>s.trim()).filter(d=>m.has(d)&&d!==t.id),ES={},EF={},st={},slack={},succ={};let cyc=false;
const fw=id=>{if(st[id]===2)return EF[id];if(st[id]===1){cyc=true;return 0}st[id]=1;const t=m.get(id);ES[id]=Math.max(0,...dp(t).map(fw));EF[id]=ES[id]+(+t.duration||0);st[id]=2;return EF[id]};
tasks.forEach(t=>fw(t.id));const end=Math.max(0,...tasks.map(t=>EF[t.id]||0)),bad=tasks.reduce((n,t)=>n+String(t.depends||'').split(',').map(s=>s.trim()).filter(d=>d&&!m.has(d)).length,0);
if(!cyc){tasks.forEach(t=>dp(t).forEach(d=>(succ[d]=succ[d]||[]).push(t.id)));const LS={},bw=id=>{if(LS[id]!==undefined)return LS[id];LS[id]=(succ[id]?Math.min(...succ[id].map(bw)):end)-(+m.get(id).duration||0);return LS[id]};tasks.forEach(t=>{slack[t.id]=bw(t.id)-ES[t.id]})}
return{ES,EF,end,slack,cyc,bad}}
function v15Shutdown(){const tasks=v15Data.shutdownTasks,c=v16CPM(tasks),T=id=>((tasks.find(t=>t.id===id)||{}).title||id),total=tasks.reduce((a,x)=>a+(+x.duration||0),0),crit=t=>!c.cyc&&Math.abs(c.slack[t.id]||0)<1e-6&&(+t.duration||0)>0,rows=[...tasks].sort((a,b)=>(c.ES[a.id]||0)-(c.ES[b.id]||0)||(a.start||'').localeCompare(b.start||'')),na=v=>c.cyc?'—':v;
return v15Card('Shutdown and turnaround planner',`<div class="v15-grid"><div class="v15-kpi"><small>Activities</small><b>${tasks.length}</b></div><div class="v15-kpi"><small>Planned work hours</small><b>${total}</b></div><div class="v15-kpi"><small>Critical path (h)</small><b>${na(c.end)}</b></div></div>${c.cyc?'<div class="notice" style="background:#fff0f0;border-color:#f3c9c9;color:#a52e2e">Circular dependency found. Remove one link before relying on these timings.</div>':''}${c.bad?`<div class="notice">${c.bad} dependency link(s) point to activities that no longer exist and are ignored.</div>`:''}<p class="v15-muted">Timings use critical-path logic on the dependencies you pick: each activity starts at hour 0 or when its predecessors finish, assuming unlimited crews. Planned start dates are not used. Treat this as a planning aid and confirm with your shutdown planner.</p><button class="btn" onclick="v15ShutdownForm()">＋ Add shutdown activity</button><div class="v15-scroll"><table class="v15-table"><thead><tr><th>Activity</th><th>Equipment</th><th>Hours</th><th>Depends on</th><th>Start (h)</th><th>Finish (h)</th><th>Float (h)</th><th>Owner</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr class="${crit(x)?'v16-crit':''}"><td>${esc(x.title)} ${crit(x)?pill('Critical'):''}</td><td>${esc(x.asset||'—')}</td><td>${esc(x.duration)}</td><td>${esc(String(x.depends||'').split(',').filter(Boolean).map(T).join(', ')||'—')}</td><td>${na(c.ES[x.id])}</td><td>${na(c.EF[x.id])}</td><td>${na(c.slack[x.id])}</td><td>${esc(x.owner||'—')}</td><td>${pill(x.status)}</td><td><button class="btn danger small" onclick="v16DelShutdown('${x.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="10">No shutdown activities planned.</td></tr>'}</tbody></table></div>`)}
function v15ShutdownForm(){const prev=v15Data.shutdownTasks;showModal('Add shutdown activity',`<form onsubmit="v15SaveShutdown(event)"><div class="field"><label>Activity *</label><input name="title" required></div><div class="v15-formgrid"><div class="field"><label>Equipment ID</label><input name="asset"></div><div class="field"><label>Duration (hours) *</label><input name="duration" type="number" min="0" step="0.5" required></div><div class="field"><label>Owner / team</label><input name="owner"></div><div class="field"><label>Planned start</label><input name="start" type="date"></div><div class="field"><label>Status</label><select name="status"><option>Planned</option><option>Ready</option><option>In Progress</option><option>Completed</option><option>Blocked</option></select></div></div>${prev.length?`<div class="field" style="margin-top:9px"><label>Must wait for (select one or more)</label><select name="depends" multiple size="${Math.min(5,prev.length)}">${prev.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></div>`:'<p class="v15-muted">This is the first activity, so it has nothing to wait for.</p>'}<div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save activity</button></div></form>`)}
function v15SaveShutdown(e){e.preventDefault();const f=new FormData(e.target),x={id:'SD-'+Date.now(),title:f.get('title'),asset:f.get('asset'),duration:+f.get('duration'),depends:f.getAll('depends').join(','),owner:f.get('owner'),start:f.get('start'),status:f.get('status')};v15Data.shutdownTasks.push(x);v15Log('Added shutdown activity',x.id,x.title+' · Waits for '+(x.depends||'nothing'));closeModal();v15SetTab('shutdown')}
function v16DelShutdown(id){const x=v15Data.shutdownTasks.find(t=>t.id===id);if(!x||!confirm('Remove "'+x.title+'" from the shutdown plan?'))return;v15Data.shutdownTasks=v15Data.shutdownTasks.filter(t=>t.id!==id);v15Log('Removed shutdown activity',id,x.title);v15SetTab('shutdown')}

<script>
/* MaintenX v17 corrections */
function v17Img(file,max=1280,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>res(r.result);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
readImage=file=>v17Img(file);

/* PM statuses follow the calendar; completing a recurring PM schedules the next one */
function v17Sync(){const t=v17Today(),d=new Date();d.setDate(d.getDate()+2);const soon=v17Date(d);let ch=false;(db.pm||[]).forEach(x=>{if(!x.due||x.status==='Completed')return;const n=x.due<t?'Overdue':x.due<=soon?'Due Soon':'Planned';if(x.status!==n){x.status=n;ch=true}});if(ch)save()}
const v17R=render;render=function(){try{v17Sync()}catch(e){}v17R()};
function completePM(id){const x=db.pm.find(p=>p.id===id);if(!x||x.status==='Completed')return;x.status='Completed';x.completedAt=v17Today();
const f=String(x.frequency||'').toLowerCase(),add=d=>{if(f==='daily')d.setDate(d.getDate()+1);else if(f==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1)};let msg='Marked done.';
if(['daily','weekly','monthly'].includes(f)&&x.due&&!db.pm.some(p=>p!==x&&p.status!=='Completed'&&p.task===x.task&&p.asset===x.asset)){let d=new Date(x.due+'T00:00:00');add(d);if(v17Date(d)<=x.completedAt){d=new Date();add(d)}const n={id:'PM-'+Date.now().toString().slice(-6),task:x.task,asset:x.asset,due:v17Date(d),frequency:x.frequency,status:'Planned'};if(x.assigned)n.assigned=x.assigned;db.pm.push(n);msg='Marked done. Next '+f+' task due '+n.due+'.'}
save();render();v16Toast(msg)}

/* Storage usage on the backup panel */

morePage=function(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=k.length+(localStorage.getItem(k)||'').length}}catch(e){}return v17More().replace('<p class="v15-muted">Everything is stored','<p class="v15-muted">Browser storage in use: about '+(n/1048576).toFixed(1)+' MB of roughly 5 MB. Everything is stored')};

<script>
/* MaintenX v18: equipment grouped by type */
let assetCat='All',v18Order=[];
const v18Groups=[['Conveyor','conveyor|belt'],['Pump','pump'],['Screen','screen'],['Compressor','compressor'],['Gearbox','gearbox|gear box'],['Mill','mill'],['Crusher','crusher'],['Motor','motor'],['Fan / Blower','fan|blower'],['Thickener','thickener'],['Filter','filter']];
function v18Group(a){const t=String(a.category||'').toLowerCase().trim(),n=String(a.name||'').toLowerCase(),hit=s=>v18Groups.find(([g,re])=>new RegExp(re).test(s));let h=t&&hit(t);if(h)return h[0];if(!t&&(h=hit(n)))return h[0];return t?t.replace(/\b\w/g,c=>c.toUpperCase()):'Other'}
function v18Cards(){const q=query.toLowerCase(),rows=db.assets.filter(x=>(assetCat==='All'||v18Group(x)===assetCat)&&(filter==='All'||x.status===filter)&&(x.name+' '+x.id+' '+x.area+' '+x.category).toLowerCase().includes(q));
return rows.map(x=>`<article class="record"><div class="recordhead"><div><h3>${esc(x.name)}</h3><p>${esc(x.id)} · ${esc(v18Group(x))}</p></div>${pill(x.status)}</div>${x.photo?`<div class="photo-preview"><img class="thumb" src="${x.photo}" alt="Equipment photo"></div>`:''}<p>Area: ${esc(x.area)}</p><div class="recordfoot"><span class="meta">Criticality: <b>${esc(x.criticality)}</b> · Run hours: ${esc(x.hours)}</span><button class="btn ghost small" onclick="assetInfo('${x.id}')">Details</button></div></article>`).join('')||'<div class="panel empty"><b>No equipment found</b>Change the type, status or search text, or add equipment.</div>'}
function v18Filter(v){query=v;document.getElementById('v18list').innerHTML=v18Cards()}
function v18Cat(i){assetCat=i<0?'All':v18Order[i];render()}
assetsPage=function(){const groups={};db.assets.forEach(a=>{(groups[v18Group(a)]||=[]).push(a)});v18Order=[...v18Groups.map(g=>g[0]),...Object.keys(groups).filter(k=>!v18Groups.some(g=>g[0]===k)&&k!=='Other'),'Other'].filter(k=>groups[k]);if(assetCat!=='All'&&!groups[assetCat])assetCat='All';
const sel=assetCat==='All'?db.assets:groups[assetCat],cnt=s=>sel.filter(x=>x.status===s).length,crit=sel.filter(x=>x.criticality==='Critical').length;
const chips=`<button class="${assetCat==='All'?'active':''}" onclick="v18Cat(-1)">All (${db.assets.length})</button>`+v18Order.map((k,i)=>`<button class="${assetCat===k?'active':''}" onclick="v18Cat(${i})">${esc(k)} (${groups[k].length})</button>`).join('');
return `${heading('Assets','Equipment register · '+esc(document.getElementById('plant').value),`<button class="btn small" onclick="openAsset()">＋ Add asset</button>`)}<div class="v15-tabs" role="tablist" aria-label="Equipment type">${chips}</div><p class="v15-muted" style="margin:0 0 8px">${esc(assetCat==='All'?'All equipment':assetCat)}: ${sel.length} total · ${cnt('Running')} running · ${cnt('Under Maintenance')} under maintenance · ${cnt('Stopped')} stopped · ${crit} critical</p><div class="toolbar"><input class="search" placeholder="Search in ${esc(assetCat==='All'?'all equipment':assetCat)}…" value="${esc(query)}" oninput="v18Filter(this.value)"><select class="filter" onchange="filter=this.value;render()">${['All','Running','Under Maintenance','Stopped'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="cardlist" id="v18list">${v18Cards()}</div>`};
const v18Open=openAsset;
openAsset=function(){v18Open();const b=document.getElementById('modalBody'),i=b.querySelector('input[name=category]');if(!i)return;i.setAttribute('list','v18cats');i.placeholder='Pick or type a type';if(assetCat!=='All')i.value=assetCat;i.insertAdjacentHTML('afterend','<datalist id="v18cats">'+[...v18Groups.map(g=>g[0]),'Other'].map(g=>`<option value="${g}">`).join('')+'</datalist>')};
if(typeof saveAsset==='function'){const v18Save=saveAsset;saveAsset=function(e){v18Save(e);try{v15SeedEquipment()}catch(x){}}}
render();
</script>
<script>
/* MaintenX v19: reliable asset adding */
imageData=async function(input,max){const files=[...(input?.files||[])].slice(0,max),out=[];for(const file of files){if(!file.type.startsWith('image/'))continue;if(file.size>15*1024*1024){v16Toast('Skipped a photo over 15 MB.');continue}try{out.push(await readImage(file))}catch(e){v16Toast('A photo could not be read and was skipped.')}}return out};
saveAsset=async function(e){e.preventDefault();const f=new FormData(e.target),id=String(f.get('id')||'').trim();if(!id){v16Toast('Enter an asset ID.');return}if(db.assets.some(a=>String(a.id).toLowerCase()===id.toLowerCase())){v16Toast('Asset ID '+id+' already exists.');return}
let photos=[];try{photos=await imageData(e.target.elements.photo,1)}catch(x){}
const a={id,name:String(f.get('name')||'').trim(),area:f.get('area'),category:String(f.get('category')||'').trim(),criticality:f.get('criticality'),status:'Running',hours:f.get('hours'),photo:photos[0]||''};
db.assets.push(a);save();try{v15SeedEquipment()}catch(x){}assetCat=v18Group(a);query='';filter='All';closeModal();render();v16Toast(a.name+' added under '+assetCat+'.')};
render();
</script>
<script>
/* MaintenX v20: add and delete plants */
let v20Plants;try{v20Plants=JSON.parse(localStorage.getItem('maintenx_plants'))}catch(e){}
if(!Array.isArray(v20Plants)||!v20Plants.length)v20Plants=[{name:'Plant 1202',desc:'Iron Ore Beneficiation Plant',place:'Raipur · Chhattisgarh'},{name:'Plant 1203',desc:'Cement Plant – Unit 1',place:'Main production line'},{name:'Plant 1204',desc:'Power Plant',place:'WHR & captive power'}];
function v20Save(){try{localStorage.setItem('maintenx_plants',JSON.stringify(v20Plants))}catch(e){v16Toast('Storage is full. Download a backup first.')}}
function v20Sync(){const s=document.getElementById('plant'),cur=s.value;s.innerHTML=v20Plants.map(p=>`<option>${esc(p.name)}</option>`).join('');s.value=v20Plants.some(p=>p.name===cur)?cur:v20Plants[0].name}

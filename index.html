return `<div style="min-height:76vh;display:flex;flex-direction:column;justify-content:center;gap:14px"><div><div style="font-size:11px;color:var(--blue);font-weight:800;letter-spacing:1px">WORKSPACE SETUP</div><h1 style="color:var(--navy);margin:5px 0">Select your plant</h1><p class="muted" style="font-size:12px">Choose a plant, or add and remove plants in your list.</p></div>${v20Plants.map((x,i)=>`<div class="panel" style="display:flex;align-items:center;gap:8px;padding:8px;border:${chosenPlant===x.name?'2px solid #0966ad':'1px solid #e4eaf0'}"><button style="flex:1;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:6px;color:inherit" onclick="v20Pick(${i})"><span style="font-size:25px;color:#0966ad">▥</span><span style="flex:1"><b style="display:block;color:var(--navy)">${esc(x.name)}</b><small class="muted">${esc([x.desc,x.place].filter(Boolean).join(' · '))}</small></span><b style="color:#15945c">${chosenPlant===x.name?'✓':''}</b></button><button class="btn danger small" aria-label="Delete ${esc(x.name)}" onclick="v20Del(${i})">Delete</button></div>`).join('')}<button class="btn ghost" onclick="v20AddForm()">＋ Add plant</button><button class="btn" onclick="v20Enter()">Continue to MaintenX <span style="float:right">→</span></button><p class="muted" style="font-size:10px;text-align:center">Deleting a plant removes it from this list only. Your equipment and work-order records stay.</p></div>`}
const v20Login=loginScreen;loginScreen=function(){return loginStep===2?v20Setup():v20Login()};
function v20Pick(i){chosenPlant=v20Plants[i].name;render()}
function v20Enter(){if(!v20Plants.length){v16Toast('Add a plant first.');return}v20Sync();document.getElementById('plant').value=chosenPlant;demoEntered=true;sessionStorage.setItem('maintenx_demo_entered','1');render()}
function v20Refresh(){v20Sync();if(document.getElementById('modal').classList.contains('show')&&document.getElementById('modalTitle').textContent==='Manage plants')v20Manage();render()}
function v20Del(i){const p=v20Plants[i];if(!p)return;if(v20Plants.length<2){v16Toast('Keep at least one plant.');return}if(!confirm('Remove "'+p.name+'" from the plant list? Equipment and work-order records are not deleted.'))return;v20Plants.splice(i,1);v20Save();if(chosenPlant===p.name)chosenPlant=v20Plants[0].name;v20Refresh()}
function v20AddForm(){showModal('Add plant',`<form onsubmit="v20SaveAdd(event)"><div class="field"><label>Plant name or code *</label><input name="name" required placeholder="e.g. Plant 1205"></div><div class="field" style="margin-top:9px"><label>What it is</label><input name="desc" placeholder="e.g. Cement Plant – Unit 2"></div><div class="field" style="margin-top:9px"><label>Location</label><input name="place" placeholder="e.g. Raipur · Chhattisgarh"></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save plant</button></div></form>`)}
function v20SaveAdd(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;if(v20Plants.some(p=>p.name.toLowerCase()===name.toLowerCase())){v16Toast('That plant is already in the list.');return}v20Plants.push({name,desc:String(f.get('desc')||'').trim(),place:String(f.get('place')||'').trim()});v20Save();chosenPlant=name;closeModal();v20Refresh();v16Toast(name+' added.')}
function v20Manage(){showModal('Manage plants',`${v20Plants.map((x,i)=>`<div class="rowitem"><div><div class="itemtitle">${esc(x.name)}</div><div class="meta">${esc([x.desc,x.place].filter(Boolean).join(' · ')||'No details')}</div></div><button class="btn danger small" onclick="v20Del(${i})">Delete</button></div>`).join('')}<p class="v15-muted" style="margin-top:10px">Deleting a plant removes it from this list only. Records stay.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" onclick="v20AddForm()">＋ Add plant</button></div>`)}
const v20More=morePage;morePage=function(){return v20More().replace('<div class="section-title"><h2>Data backup</h2></div>','<div class="section-title"><h2>Plants</h2></div><div class="panel" style="margin-bottom:12px"><p class="v15-muted">Add or remove plants in the selector. Current plant: '+esc(document.getElementById('plant').value)+'.</p><button class="btn secondary" onclick="v20Manage()">Manage plants</button></div><div class="section-title"><h2>Data backup</h2></div>')};
v20Sync();render();
</script>

<script>
/* MaintenX v21: professional dashboards (scrubber, compressors, home, work orders, PM, spares) */
const V21={g:'#15945c',a:'#c58a18',r:'#cf4141',b:'#0966ad',n:'#9aa9b8'};
const v21Col=p=>p>=80?V21.g:p>=60?V21.a:V21.r;
const v21Age=d=>{const t=new Date(d);return isNaN(t)?null:Math.floor((Date.now()-t)/864e5)};
const v21P=(t,s,h)=>`<section class="v21p"><h3>${t}</h3><div class="s">${s||''}</div>${h}</section>`;
const v21G=(p,t,s)=>{p=Math.max(0,Math.min(100,Math.round(p)));const d='M10 60A50 50 0 0 1 110 60';return `<div class="v21g"><svg viewBox="0 0 120 68"><path d="${d}" fill="none" stroke="#e8eef4" stroke-width="11" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${v21Col(p)}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${p*1.5708} 200"/><text x="60" y="58" text-anchor="middle" font-size="23" font-weight="800" fill="#082d50">${p}%</text></svg><b>${esc(t)}</b><small>${esc(s||'')}</small></div>`};
const v21D=(parts,c)=>{const tot=parts.reduce((a,x)=>a+x[1],0)||1;let o=25;const rg=parts.filter(x=>x[1]>0).map(x=>{const l=x[1]/tot*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${x[2]}" stroke-width="6" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${o}"/>`;o-=l;return s}).join('');return `<div class="v21d"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#e8eef4" stroke-width="6"/>${rg}<text x="21" y="23.5" text-anchor="middle" font-size="9" font-weight="800" fill="#082d50">${c}</text></svg><div style="flex:1">${parts.map(x=>`<div class="v21l"><i style="background:${x[2]}"></i>${esc(x[0])}<b>${x[1]}</b></div>`).join('')}</div></div>`};
const v21B=(l,p,c,r)=>`<div class="v21b"><span title="${esc(l)}">${esc(l)}</span><div class="v21t"><i style="width:${Math.max(2,Math.min(100,p))}%;background:${c}"></i></div><em>${esc(r)}</em></div>`;
const v21S=(vals,lines)=>{if(vals.length<2)return '<p class="muted" style="font-size:11px">Save at least two readings to see a trend.</p>';const W=320,H=120,m=Math.max(130,...vals),x=i=>10+i*(W-20)/(vals.length-1),y=v=>H-10-v/m*(H-20);return `<svg class="v21sp" viewBox="0 0 ${W} ${H}">${lines.map(([v,c])=>`<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="4 3"/>`).join('')}<polyline fill="none" stroke="${V21.b}" stroke-width="2.5" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${v>=100?V21.r:v>=63?V21.a:V21.g}"/>`).join('')}</svg>`};
function v21Ins(h,add){const s=h.indexOf('<div class="pagehead">');if(s<0)return add+h;let d=0,i=s;const re=/<div\b|<\/div>/g;re.lastIndex=s;let m;while((m=re.exec(h))){d+=m[0]==='</div>'?-1:1;if(d===0){i=m.index+6;break}}return h.slice(0,i)+add+h.slice(i)}
function v21Safe(f){try{return f()}catch(e){console.error('v21',e);return ''}}

function v21Scrub(){const rs=db.scrubberReadings||[];if(!rs.length)return v21P('Condition dashboard','Scrubber vibration overview','<p class="muted" style="font-size:12px">Save the first daily reading to see health score, heat map and trend.</p>');
 const r=rs[0],v=r.values||{},pts=scrubberPoints.map(([p,a])=>{const k=sKey(p,a),x=v[k],st=sState(x,k);return{p,a,x,st,pct:x===''||x==null?null:+x/sLimit(k).alarm*100}});
 const c=s=>pts.filter(q=>q.st===s).length,meas=pts.length-c('Not entered'),score=meas?pts.reduce((a,q)=>a+(q.st==='Normal'?100:q.st==='Warning'?50:0),0)/meas:0;
 const grp=p=>/^SR-\d/.test(p)?p.slice(0,4):p.split(' ')[0],gs=[...new Set(pts.map(q=>grp(q.p)))],sc={Normal:V21.g,Warning:V21.a,Alarm:V21.r,'Not entered':V21.n};
 const heat=gs.map(g=>`<div class="v21hm"><b>${esc(g)}</b>${pts.filter(q=>grp(q.p)===g).map(q=>`<div class="c" style="background:${sc[q.st]}">${q.x===''||q.x==null?'–':esc(q.x)}<small>${esc(q.p.replace(g,'').trim().replace(' Side','')||'—')} ${q.a}</small></div>`).join('')}</div>`).join('');
 const top=pts.filter(q=>q.pct!=null).sort((a,b)=>b.pct-a.pct).slice(0,5).map(q=>v21B(q.p+' '+q.a,q.pct,sc[q.st],q.x+' mm/s')).join('');
 const hist=rs.slice(0,14).reverse().map(x=>{let m=0;scrubberPoints.forEach(([p,a])=>{const k=sKey(p,a),y=x.values?.[k];if(y!==''&&y!=null)m=Math.max(m,+y/sLimit(k).alarm*100)});return m});
 const age=v21Age(r.date),fr=age==null?'':age<=1?['Up to date',V21.g]:age<=7?[age+' days since last reading',V21.a]:[age+' days since last reading',V21.r];
 return `<div style="display:flex;justify-content:flex-end;margin:0 0 8px"><button class="btn small" onclick="v21ScrubPDF()">⬇ Dashboard PDF</button></div><div class="v21hero"><small>CONDITION DASHBOARD · SCRUBBER SCB-001</small><div style="font-size:12px;margin-top:4px">Latest reading ${esc(r.date||'')} · ${esc(r.shift||'')} · ${esc(r.status||'')} ${fr?`<span class="v21chip" style="background:${fr[1]};margin-left:6px">${fr[0]}</span>`:''}</div></div>`
 +v21P('Health overview',`${meas} of ${pts.length} points measured`,`<div class="v21row">${v21G(score,'Health score','Normal 100 · Warning 50 · Alarm 0')}${v21D([['Normal',c('Normal'),V21.g],['Warning',c('Warning'),V21.a],['Alarm',c('Alarm'),V21.r],['Not entered',c('Not entered'),V21.n]],meas)}</div>`)
 +v21P('Component heat map','Latest vibration, mm/s (H = horizontal, V = vertical)',heat)
 +v21P('Closest to alarm limit','Reading as % of alarm limit',top||'<p class="muted" style="font-size:12px">No readings entered.</p>')
 +v21P('Worst-point trend','Highest % of alarm limit per reading · last '+hist.length+' (dashed: warning amber, alarm red)',v21S(hist,[[100,V21.r],[63,V21.a]]));}

function v21Comp(){const as=db.compressorAssets||[];if(!as.length)return '';
 const it=as.flatMap(c=>c.filters.map(f=>{const rem=f.dueHours-c.currentHours;return{c:c.id,n:f.name,rem,used:(f.interval-rem)/f.interval*100}})).sort((a,b)=>a.rem-b.rem);
 const sc=s=>as.filter(c=>compressorStatus(c)===s).length,avail=it.length?it.filter(i=>i.rem>200).length/it.length*100:100;
 const last=(db.compressorLogs||[]).map(x=>x.date).filter(Boolean).sort().pop(),age=last?v21Age(last):null,mx=Math.max(1,...as.map(c=>+c.currentHours||0));
 const rc=r=>r<=0?V21.r:r<=200?V21.a:V21.g,fam={};as.forEach(c=>fam[c.modelFamily]=(fam[c.modelFamily]||0)+1);
 return `<div style="display:flex;justify-content:flex-end;margin:0 0 8px"><button class="btn small" onclick="v21CompPDF()">⬇ Dashboard PDF</button></div><div class="v21hero"><small>FLEET DASHBOARD · COMPRESSORS</small><div style="font-size:12px;margin-top:4px">${as.length} compressors · ${it.length} service items ${age!=null?`<span class="v21chip" style="background:${age>30?V21.a:V21.g};margin-left:6px">Last entry ${age} days ago${age>30?' · update hours':''}</span>`:''}</div></div>`
 +v21P('Fleet health','Service status from running hours',`<div class="v21row">${v21G(avail,'Items in interval','More than 200 h remaining')}${v21D([['OK',sc('OK'),V21.g],['Due soon',sc('DUE SOON'),V21.a],['Change now',sc('CHANGE NOW'),V21.r]],as.length)}</div>`)
 +v21P('Most urgent service items','Bar = % of interval used · right = hours remaining',it.slice(0,6).map(i=>v21B(i.c+' · '+i.n,i.used,rc(i.rem),i.rem+' h')).join(''))
 +v21P('Running hours by compressor','Latest logged hours',[...as].sort((a,b)=>b.currentHours-a.currentHours).map(c=>v21B(c.id,c.currentHours/mx*100,V21.b,Number(c.currentHours).toLocaleString('en-IN'))).join('')
 +`<div style="margin-top:8px;font-size:10px;color:var(--muted)">Model families: ${Object.entries(fam).map(([k,n])=>esc(k)+' ×'+n).join(' · ')}</div>`);}

function v21Home(){const pm=db.pm||[],o=db.orders||[],sp=db.spares||[],as=db.assets||[],over=pm.filter(x=>x.status==='Overdue').length;
 const pmP=pm.length?(pm.length-over)/pm.length*100:100,woP=o.length?o.filter(x=>x.status==='Completed').length/o.length*100:100,spP=sp.length?sp.filter(x=>x.stock>x.min).length/sp.length*100:100,asP=as.length?as.filter(x=>x.status==='Running').length/as.length*100:100;

   const bar=document.createElement('div');bar.className='row';bar.style.cssText='gap:7px;flex-wrap:wrap;margin-top:6px';
   const mk=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls+' small';b.textContent=t;b.onclick=fn;bar.appendChild(b)};

<script>

(()=>{
 const S={scrub:{mode:false,sel:new Set(),vis:[]},comp:{mode:false,sel:new Set(),vis:[]}};
 const $=(t,c,x,f)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(f)e.onclick=f;return e};
 let undoSnap=null,undoTimer=null;

 /* ---------- styles ---------- */
 const st=document.createElement('style');
 st.textContent='#mxUndo{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:#082d50;color:#fff;padding:9px 12px 9px 15px;border-radius:12px;font-size:12px;z-index:70;box-shadow:0 6px 20px #06274655;max-width:92vw}#mxUndo.show{display:flex}#mxUndo button{background:#fff;color:#082d50;border:0;border-radius:8px;padding:6px 11px;font-weight:700;font-size:12px;cursor:pointer}.mxsel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin:0 0 8px;color:var(--navy)}.mxsel input{width:18px;height:18px}article.record.mxpicked{outline:2px solid var(--red)}.mxbar .btn[disabled]{opacity:.45}.mxdelrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}';
 document.head.appendChild(st);

 /* ---------- lookups ---------- */
 const scrubExists=id=>(db.scrubberReadings||[]).some(r=>r.id===id);
 const compExists=id=>(db.compressorLogs||[]).some(r=>r.id===id);
 const scrubId=a=>{const b=a.querySelector('button[onclick^="viewScrub("]'),m=b&&b.getAttribute('onclick').match(/viewScrub\('([^']+)'\)/);let id=m?m[1]:'';if(!id){const p=a.querySelector('.recordhead p');id=p?p.textContent.split(' · ')[0].trim():''}return scrubExists(id)?id:''};
 const compId=a=>{const p=a.querySelector('.recordhead p'),id=p?p.textContent.split(' · ')[0].trim():'';return compExists(id)?id:''};
 const label=(k,id)=>{if(k==='scrub'){const r=db.scrubberReadings.find(x=>x.id===id);return r?`${r.date||''} · ${r.shift||''}`:id}const r=db.compressorLogs.find(x=>x.id===id);return r?`${r.compressor} · ${r.type} · ${r.date||''}`:id};
 const ctx=()=>{
  if(page==='scrubber'&&scrubTab==='history')return{k:'scrub',id:scrubId};
  if(page==='moduleHistory'&&(moduleHistorySource==='scrubber'||moduleHistorySource==='reliability'))return{k:'scrub',id:scrubId};
  if(page==='compressorHistory')return{k:'comp',id:compId};
  return null;
 };

 /* ---------- compressor recalculation after deleting records ---------- */
 function recompute(cid,types){
  const c=(db.compressorAssets||[]).find(x=>x.id===cid);if(!c)return;
  const seed=(typeof compressorSeed!=='undefined'?compressorSeed:[]).find(x=>x.id===cid)||{filters:[],currentHours:0};
  const logs=db.compressorLogs.filter(l=>l.compressor===cid);
  const best=arr=>arr.reduce((b,l)=>!b||String(l.date)>String(b.date)||(String(l.date)===String(b.date)&&+l.runningHours>=+b.runningHours)?l:b,null);
  if(types.has('Running Hour Reading'))c.currentHours=Math.max(+seed.currentHours||0,...logs.filter(l=>l.type==='Running Hour Reading').map(l=>+l.runningHours||0));
  c.filters.forEach(f=>{
   if(!types.has(f.name))return;
   const l=best(logs.filter(x=>x.type===f.name)),sf=(seed.filters||[]).find(x=>x.name===f.name);
   if(l){f.lastHours=+l.runningHours;f.lastDate=l.date}else if(sf){f.lastHours=sf.lastHours;f.lastDate=sf.lastDate}
   f.dueHours=f.lastHours+f.interval;
  });
  c.filters.forEach(f=>{f.remaining=f.dueHours-c.currentHours;f.status=f.remaining<=0?'CHANGE NOW':f.remaining<=200?'DUE SOON':'OK'});
 }

 /* ---------- delete + undo ---------- */
 function remove(k,ids){
  const set=new Set(ids);let n=0;
  if(k==='scrub'){
   undoSnap={k,rows:db.scrubberReadings.slice()};
   db.scrubberReadings=db.scrubberReadings.filter(r=>{if(set.has(r.id)){n++;return false}return true});
  }else{
   undoSnap={k,assets:JSON.parse(JSON.stringify(db.compressorAssets)),rows:db.compressorLogs.slice()};
   const aff={};
   db.compressorLogs=db.compressorLogs.filter(l=>{if(set.has(l.id)){n++;(aff[l.compressor]||(aff[l.compressor]=new Set())).add(l.type);return false}return true});
   Object.keys(aff).forEach(cid=>recompute(cid,aff[cid]));

  clearTimeout(undoTimer);undoTimer=setTimeout(()=>{e.className='';undoSnap=null},9000);
 }
 function doUndo(){
  const u=undoSnap;if(!u)return;
  if(u.k==='scrub')db.scrubberReadings=u.rows;else{db.compressorLogs=u.rows;db.compressorAssets=u.assets}

 function ask(k,ids){

  const noun=k==='scrub'?'scrubber reading':'compressor record';
  let extra=k==='scrub'?'Photos attached to the reading are removed too.':'Running hours and filter due dates are recalculated from the remaining records.';
  if(k==='comp'&&ids.some(id=>String(id).startsWith('IMP-')))extra+=' Imported baseline records fall back to the workbook values in the status table.';
  const what=n===1?`<b>${esc(label(k,ids[0]))}</b>`:`these <b>${n}</b> ${noun}s`;
  showModal('Delete '+(n>1?n+' '+noun+'s':noun)+'?',`<p style="font-size:13px;line-height:1.5;margin:0 0 6px">Delete ${what} from this device? ${esc(extra)}</p><p class="sub">You can undo right after deleting.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="mxGo">Delete${n>1?' '+n:''}</button></div>`);
  document.getElementById('mxGo').onclick=()=>{closeModal();remove(k,ids)};
 }

 /* ---------- page decoration ---------- */
 function decorate(){
  const app=document.getElementById('app');if(!app)return;
  if(page==='compressors'){decorateMon(app);return}
  const c=ctx();if(!c)return;
  const s=S[c.k],arts=[...app.querySelectorAll('article.record')].map(a=>({a,id:c.id(a)})).filter(x=>x.id);
  s.vis=arts.map(x=>x.id);
  [...s.sel].forEach(id=>{if(!s.vis.includes(id))s.sel.delete(id)});
  const list=app.querySelector('.cardlist');
  if(list&&arts.length){
   const bar=$('div','panel section mxbar'),row=$('div','row');row.style.cssText='gap:7px;flex-wrap:wrap;align-items:center';
   row.appendChild($('button','btn secondary small',s.mode?'✓ Done selecting':'☑ Select',()=>{s.mode=!s.mode;s.sel.clear();render()}));
   if(s.mode){
    row.appendChild($('button','btn secondary small','Select all ('+s.vis.length+')',()=>{s.vis.forEach(id=>s.sel.add(id));render()}));
    row.appendChild($('button','btn ghost small','Clear',()=>{s.sel.clear();render()}));
    const b=$('button','btn danger small','🗑 Delete selected ('+s.sel.size+')',()=>ask(c.k,[...s.sel]));if(!s.sel.size)b.disabled=true;row.appendChild(b);
   }
   row.appendChild($('button','btn danger small','🗑 Delete all shown ('+s.vis.length+')',()=>ask(c.k,s.vis.slice())));
   bar.appendChild(row);
   if(s.mode){const h=$('p','sub','Tick the records to remove, then tap Delete selected.');h.style.margin='8px 0 0';bar.appendChild(h)}
   list.parentNode.insertBefore(bar,list);
  }
  arts.forEach(({a,id})=>{
   if(s.mode){
    const lab=$('label','mxsel'),cb=document.createElement('input');cb.type='checkbox';cb.checked=s.sel.has(id);
    cb.onchange=()=>{cb.checked?s.sel.add(id):s.sel.delete(id);a.classList.toggle('mxpicked',cb.checked);render()};
    lab.appendChild(cb);lab.appendChild($('span',null,'Select this record'));a.insertBefore(lab,a.firstChild);
    a.classList.toggle('mxpicked',s.sel.has(id));
   }
   const host=a.querySelector('.recordfoot')||a.querySelector(':scope > .row:last-child');

<script>
/* MaintenX v30: scrubber reading cells accept decimals AND ranges such as 1.6-2.3 */
(()=>{
 /* parse one cell: returns {ok, num, text}. A range keeps the typed text, and the higher value drives alarm/warning status. */
 const NUM='(\\d+(?:\\.\\d+)?|\\.\\d+)';
 const reOne=new RegExp('^'+NUM+'$'),reRange=new RegExp('^'+NUM+'\\s*-\\s*'+NUM+'$');
 function parseCell(raw){
  const t=String(raw==null?'':raw).trim().replace(/[–—]/g,'-').replace(/,/g,'.');
  if(!t)return{ok:true,num:'',text:''};
  if(reOne.test(t))return{ok:true,num:t,text:''};
  const m=t.match(reRange);
  if(m){const a=parseFloat(m[1]),b=parseFloat(m[2]);return{ok:true,num:String(Math.max(a,b)),text:parseFloat(m[1])+'-'+parseFloat(m[2])}}
  return{ok:false};
 }
 /* make every scrubber vibration cell a text box with a decimal keypad that allows digits, one or two dots and a dash */
 const isCell=el=>el&&el.tagName==='INPUT'&&typeof el.name==='string'&&el.name.includes('|')&&/\((?:mm\/s)\)/.test((el.previousElementSibling&&el.previousElementSibling.textContent)||'');
 function fix(root){
  (root.querySelectorAll?root.querySelectorAll('input[name*="|"]'):[]).forEach(el=>{
   if(el.dataset.v30||!isCell(el))return;
   el.dataset.v30='1';el.type='text';el.setAttribute('inputmode','decimal');el.setAttribute('autocomplete','off');el.placeholder='e.g. 1.6 or 1.6-2.3';
   el.removeAttribute('min');el.removeAttribute('step');
   el.addEventListener('input',()=>{
    const c=el.value.replace(/[–—]/g,'-').replace(/,/g,'.').replace(/[^0-9.\-]/g,'');
    if(c!==el.value)el.value=c;
   });
  });
 }
 new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fix(n)}))}).observe(document.body,{childList:true,subtree:true});
 fix(document);

 /* save: same as before, plus range support (original typed text kept in valuesText) */
 saveScrub=function(e){
  e.preventDefault();const form=e.target,f=new FormData(form),person=String(f.get('person')||'').trim(),date=f.get('date');
  if(!date||!person){const k=!date?'date':'person',el=form.elements[k];v16Toast(!date?'Enter the date first.':'Enter the technician / engineer name first.');if(el){el.scrollIntoView({block:'center'});el.focus()}return}
  const values={},valuesText={};
  for(const [p,a] of scrubberPoints){
   const k=sKey(p,a),c=parseCell(f.get(k));
   if(!c.ok){const el=form.elements[k];v16Toast('Check '+p+' · '+a+': use a number like 1.6 or a range like 1.6-2.3.');if(el){el.scrollIntoView({block:'center'});el.focus()}return}
   values[k]=c.num;if(c.text)valuesText[k]=c.text;
  }
  const files=[...(form.elements.photos?.files||[])].slice(0,3),btn=form.querySelector('button[type=submit]'),txt=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Saving…'}
  const fail=m=>{if(btn){btn.disabled=false;btn.textContent=txt}v16Toast(m)};
  Promise.all(files.map(x=>v17Img(x).catch(()=>null))).then(ph=>{let photos=ph.filter(Boolean);
   const rec=()=>{const r={id:'SCR-'+Date.now(),date,shift:f.get('shift'),person,status:f.get('status'),rpm:f.get('rpm'),current:f.get('current'),feed:f.get('feed'),remarks:f.get('remarks'),values,photos};if(Object.keys(valuesText).length)r.valuesText=valuesText;return r};
   const tryPut=()=>{db.scrubberReadings.unshift(rec());try{localStorage.setItem('maintenx_db',JSON.stringify(db));return true}catch(x){db.scrubberReadings.shift();return false}};
   let ok=tryPut(),dropped=false;if(!ok&&photos.length){photos=[];dropped=true;ok=tryPut()}
   if(!ok){fail('NOT saved: phone storage is full. Open More, download a backup, then delete old photos.');return}
   v16Toast(dropped?'Saved without photos (storage nearly full).':files.length&&ph.some(x=>!x)?'Saved. Some photos could not be read.':'Reading saved');scrubTab='history';render()
  }).catch(()=>fail('Could not save. Please try again.'))
 };

 /* reading detail shows the range exactly as typed */
 viewScrub=function(id){
  const r=db.scrubberReadings.find(x=>x.id===id);if(!r)return;
  showModal('Scrubber readings',scrubberPoints.map(([p,a])=>{const k=sKey(p,a),v=r.values[k],t=r.valuesText&&r.valuesText[k];return `<p>${p} · ${a}: <b>${t?esc(t):(v||'--')} mm/s</b> ${pill(sState(v,k))}${t?` <span class="sub">(status uses ${esc(v)})</span>`:''}</p>`}).join('')+`<p>${esc(r.remarks||'')}</p>`+(r.photos||[]).map(x=>`<img src="${x}" style="max-width:100%">`).join(''));
 };
})();
</script>

/* MaintenX v31: Scrubber TEMPERATURE reading option (entry, history, status report, delete, filter, share) */
(()=>{

 const TP=[['pinionDE','Pinion DE'],['pinionNDE','Pinion NDE'],['t1fp_a','T-1 F/D towards FP · reading 1'],['t1fp_b','T-1 F/D towards FP · reading 2'],['t1pt_a','T-1 F/D towards PT · reading 1'],['t1pt_b','T-1 F/D towards PT · reading 2'],['t2fp_a','T-2 F/D towards FP · reading 1'],['t2fp_b','T-2 F/D towards FP · reading 2'],['t2pt_a','T-2 F/D towards PT · reading 1'],['t2pt_b','T-2 F/D towards PT · reading 2']];
 const tState=v=>v===''||v==null||isNaN(+v)?'Not entered':(+v>=lim().alarm?'Alarm':+v>=lim().warning?'Warning':'Normal');

 const overall=r=>{const m=worst(r);return m==null?'Not entered':tState(m)};
 const col=s=>s==='Alarm'?'#c24141':s==='Warning'?'#b7791f':s==='Normal'?'#16845b':'#6b7f90';
 const badge=s=>`<span style="display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;background:${col(s)}">${s}</span>`;
 const dmy=d=>String(d||'').split('-').reverse().join('/');
 const t12=t=>{if(!t)return '';const [h,m]=t.split(':');const H=+h;return ((H%12)||12)+':'+m+' '+(H<12?'AM':'PM')};
 const pair=(a,b)=>(a===''||a==null)&&(b===''||b==null)?'--':`${a===''||a==null?'--':a} / ${b===''||b==null?'--':b}`;
 const $=(t,c,x,f)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(f)e.onclick=f;return e};
 /* vibration cells: number or range (higher value used) */
 const NUM='(\\d+(?:\\.\\d+)?|\\.\\d+)',reOne=new RegExp('^'+NUM+'$'),reRange=new RegExp('^'+NUM+'\\s*-\\s*'+NUM+'$');

  ${(r.gbVib||r.pnVib)?`<div class="sec">Vibration monitoring</div>${row('Gear box',esc(r.gbText||r.gbVib||'--')+' mm/s')}${row('Pinion',esc(r.pnText||r.pnVib||'--')+' mm/s')}`:''}

   const tryPut=()=>{list().unshift(rec());try{localStorage.setItem('maintenx_db',JSON.stringify(db));return true}catch(x){list().shift();return false}};
   let ok=tryPut(),dropped=false;if(!ok&&photos.length){photos=[];dropped=true;ok=tryPut()}

<script>
/* MaintenX v32: Scrubber Status DASHBOARD (visual report like the shared image) with Save / Share as image */
(()=>{
 const W=760,D={id:''};

 const rank={Normal:0,Warning:1,Alarm:2};

 const X=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const C={blue:'#0f3f8f',mid:'#1d4fa3',light:'#eaf2fb',Normal:['#e3f6dc','#8fd08a','#14532d','#16a34a'],Warning:['#fff3d6','#e6b84a','#8a5a00','#d08a10'],Alarm:['#fde3e3','#e08080','#9b1c1c','#c24141'],none:['#f1f5f9','#c9d6e2','#44566a','#7b8da0']};

<script>
/* MaintenX v33: edit saved temperature readings within 48 hours of saving */
(()=>{

  const r=list().find(x=>x.id===id);if(!r)return;

 const WIN=172800000,stamp=r=>{const t=+String(r&&r.id||'').split('-')[1];return t>1e12?t:NaN},canEdit=r=>!!r&&!isNaN(stamp(r))&&Date.now()-stamp(r)<WIN;
 const left=r=>Math.max(1,Math.ceil((WIN-(Date.now()-stamp(r)))/3600000));
 const N='(\\d+(?:\\.\\d+)?|\\.\\d+)',r1=new RegExp('^'+N+'$'),r2=new RegExp('^'+N+'\\s*-\\s*'+N+'$');
 const pv=raw=>{const t=String(raw==null?'':raw).trim().replace(/[–—]/g,'-').replace(/,/g,'.');if(!t)return{ok:1,num:'',text:''};if(r1.test(t))return{ok:1,num:t,text:''};const m=t.match(r2);return m?{ok:1,num:String(Math.max(+m[1],+m[2])),text:(+m[1])+'-'+(+m[2])}:{ok:0}};
 const f=(n,l,v,x='')=>`<div class="field"><label>${l}</label><input name="${n}" value="${esc(v==null?'':v)}" ${x}></div>`;
 /* ---- scrubber vibration edit ---- */
 const SV=()=>db.scrubberReadings||[];
 function editV(id){
  const r=SV().find(x=>x.id===id);if(!r)return;if(!canEdit(r)){v16Toast('Readings can only be edited within 2 days of saving.');render();return}
  showModal('Edit vibration reading',`<form onsubmit="mxV.save(event,'${id}')"><p class="sub">Editing allowed for about ${left(r)} more hour(s). Use a number or a range like 1.6-2.3.</p><div class="formgrid">${f('date','Date',r.date,'type="date" required')}${f('shift','Shift',r.shift)}${f('person','Technician / Engineer',r.person,'required')}${f('status','Machine status',r.status)}${f('rpm','RPM',r.rpm)}${f('current','Motor current A',r.current)}${f('feed','Feed TPH',r.feed)}
  ${scrubberPoints.map(([p,a])=>{const k=sKey(p,a);return f('v_'+k,p+' · '+a+' mm/s',(r.valuesText&&r.valuesText[k])||(r.values||{})[k],'inputmode="decimal"')}).join('')}</div>
  <div class="field"><label>Remarks</label><textarea name="remarks" rows="3">${esc(r.remarks||'')}</textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save changes</button></div></form>`);
 }
 function saveV(e,id){
  e.preventDefault();const r=SV().find(x=>x.id===id),F=new FormData(e.target),g=k=>String(F.get(k)||'').trim();
  if(!canEdit(r)){closeModal();v16Toast('Edit window (2 days) has ended.');render();return}
  if(!g('date')||!g('person')){v16Toast('Date and technician name are required.');return}
  const vals={},txt={};
  for(const [p,a] of scrubberPoints){const k=sKey(p,a),c=pv(F.get('v_'+k));if(!c.ok){v16Toast('Check '+p+' · '+a+': use a number like 1.6 or a range like 1.6-2.3.');return}vals[k]=c.num;if(c.text)txt[k]=c.text}
  ['date','shift','person','status','rpm','current','feed','remarks'].forEach(k=>r[k]=g(k));
  r.values=vals;delete r.valuesText;if(Object.keys(txt).length)r.valuesText=txt;r.editedAt=Date.now();
  try{save()}catch(x){v16Toast('Could not save changes.');return}closeModal();v16Toast('Reading updated');render();
 }
 window.mxV={edit:editV,save:saveV};
 /* ---- compressor edit ---- */
 const CL=()=>db.compressorLogs||[];
 function editC(id){
  const r=CL().find(x=>x.id===id);if(!r)return;if(!canEdit(r)){v16Toast('Records can only be edited within 2 days of saving.');render();return}
  showModal('Edit compressor record',`<form onsubmit="mxC.save(event,'${id}')"><p class="sub">${esc(r.compressor)} · ${esc(r.type)} (fixed) · editing allowed for about ${left(r)} more hour(s).</p>${f('date','Date',r.date,'type="date" required')}${f('runningHours','Running hours',r.runningHours,'type="number" min="0" step="0.1" required')}${f('technician','Technician / inspector',r.technician,'required')}<div class="field"><label>Remarks</label><textarea name="remarks" rows="2">${esc(r.remarks||'')}</textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save changes</button></div></form>`);
 }
 function saveC(e,id){
  e.preventDefault();const r=CL().find(x=>x.id===id),F=new FormData(e.target),h=Number(F.get('runningHours'));
  if(!canEdit(r)){closeModal();v16Toast('Edit window (2 days) has ended.');render();return}
  if(isNaN(h)||h<0||!F.get('date')){v16Toast('Enter a valid date and running hours.');return}
  const c=(db.compressorAssets||[]).find(x=>x.id===r.compressor),oh=Number(r.runningHours),od=r.date;
  if(c){if(r.type==='Running Hour Reading'){if(Number(c.currentHours)===oh)c.currentHours=h}else{const it=c.filters.find(x=>x.name===r.type);if(it&&Number(it.lastHours)===oh&&it.lastDate===od){it.lastHours=h;it.lastDate=F.get('date');it.dueHours=h+it.interval;it.remaining=it.dueHours-c.currentHours;it.status=it.remaining<=0?'CHANGE NOW':it.remaining<=200?'DUE SOON':'OK'}}}
  r.date=F.get('date');r.runningHours=h;r.technician=String(F.get('technician')||'').trim();r.remarks=String(F.get('remarks')||'').trim();r.editedAt=Date.now();
  try{save()}catch(x){v16Toast('Could not save changes.');return}closeModal();v16Toast('Record updated');render();
 }
 /* ---- compressor dashboard (10 styles) ---- */
 const TH=[['Classic Blue','#0f3f8f','#1d4fa3','#eaf2fb','#bcd0e6'],['Emerald','#0b5d3b','#15803d','#e6f6ec','#b7dfc6'],['Midnight','#0b1b3a','#1e3a8a','#dbe5f7','#9fb3d9'],['Crimson','#7f1d1d','#b91c1c','#fdeaea','#f0bcbc'],['Teal','#0f5e63','#0e8a91','#e0f5f6','#a8dadd'],['Violet','#4c1d95','#6d28d9','#efe9fb','#cdbdf0'],['Amber Industrial','#7c4a03','#b45309','#fdf1dc','#f0d29b'],['Slate','#1f2937','#475569','#eef1f5','#cbd5e1'],['Ocean','#075985','#0284c7','#e0f2fe','#a5d3f0'],['Rose','#831843','#be185d','#fce7f3','#f5b8d3']];
 let SI=0;try{SI=Math.min(9,Math.max(0,+localStorage.getItem('mxCS')||0))}catch(e){}
 const SC={'OK':['#16a34a','#e3f6dc'],'DUE SOON':['#d08a10','#fff3d6'],'CHANGE NOW':['#c24141','#fde3e3']};
 function dash(){
  const t=TH[SI],A=db.compressorAssets||[],st=x=>x<=0?'CHANGE NOW':x<=200?'DUE SOON':'OK',n={'OK':0,'DUE SOON':0,'CHANGE NOW':0};
  const cards=A.map(c=>{const rows=c.filters.map(it=>{const rm=it.dueHours-c.currentHours,s=st(rm);n[s]++;const used=Math.max(0,Math.min(100,100-rm/it.interval*100));return `<div class="it"><div class="l"><b>${esc(it.name)}</b><span style="background:${SC[s][1]};color:${SC[s][0]}">${s}</span></div><div class="bar"><i style="width:${used}%;background:${SC[s][0]}"></i></div><small>Last ${esc(it.lastDate||'–')} @ ${Number(it.lastHours).toLocaleString('en-IN')} h · due ${Number(it.dueHours).toLocaleString('en-IN')} h · <b>${rm} h left</b></small></div>`}).join('');
   const w=c.filters.map(it=>st(it.dueHours-c.currentHours)),ws=w.includes('CHANGE NOW')?'CHANGE NOW':w.includes('DUE SOON')?'DUE SOON':'OK';
   return `<div class="cd" style="border-top:6px solid ${SC[ws][0]}"><div class="ch"><b>${esc(c.id)}</b><em>${Number(c.currentHours).toLocaleString('en-IN')} h</em></div>${rows}</div>`}).join('');
  const lg=[...CL()].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.compressor)}</td><td>${esc(x.type)}</td><td>${Number(x.runningHours).toLocaleString('en-IN')} h</td><td>${esc(x.technician||'–')}</td></tr>`).join('');
  const css=`@page{size:A4 portrait;margin:6mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{margin:0;background:#dfe6ee;font-family:Arial,Helvetica,sans-serif;color:#12263a}.tb{display:flex;justify-content:flex-end;padding:10px}.tb button{background:${t[2]};color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700}.pg{max-width:780px;margin:0 auto 16px;background:#fff;border:3px solid ${t[2]};border-radius:14px;padding:12px}.hd{background:${t[1]};color:#fff;border-radius:10px;padding:12px;text-align:center}.hd h1{margin:0;font-size:22px;letter-spacing:1px}.hd p{margin:4px 0 0;font-size:12px;opacity:.9}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.k div{background:${t[3]};border:1px solid ${t[4]};border-radius:10px;text-align:center;padding:8px}.k b{display:block;font-size:24px;color:${t[1]}}.k small{font-size:11px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cd{border:1px solid ${t[4]};border-radius:10px;padding:8px;background:#fff;break-inside:avoid}.ch{display:flex;justify-content:space-between;background:${t[3]};border-radius:6px;padding:6px 8px;color:${t[1]}}.ch em{font-style:normal;font-weight:800}.it{margin-top:7px}.l{display:flex;justify-content:space-between;font-size:11px;align-items:center}.l span{font-size:9px;font-weight:800;padding:2px 7px;border-radius:9px}.bar{height:8px;background:#e8eef4;border-radius:4px;margin:3px 0}.bar i{display:block;height:100%;border-radius:4px}.it small{font-size:9px;color:#5b6b82}h2{margin:12px 0 6px;background:${t[1]};color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:${t[2]};color:#fff;padding:5px;text-align:left}td{padding:5px;border-bottom:1px solid ${t[4]}}.ft{text-align:center;font-size:10px;color:#6b7f90;margin-top:8px}@media print{.tb{display:none}body{background:#fff}.pg{max-width:none;border-radius:0}}`;
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compressor Dashboard</title><style>${css}</style></head><body><div class="tb"><button onclick="window.print()">Print / Save as PDF</button></div><div class="pg"><div class="hd"><h1>COMPRESSOR SERVICE DASHBOARD</h1><p>${esc(t[0])} · ${new Date().toLocaleDateString('en-GB')} · ${A.length} compressors</p></div><div class="k"><div><b>${A.length}</b><small>Compressors</small></div><div><b style="color:#c24141">${n['CHANGE NOW']}</b><small>Change now</small></div><div><b style="color:#d08a10">${n['DUE SOON']}</b><small>Due soon</small></div><div><b style="color:#16a34a">${n['OK']}</b><small>Within interval</small></div></div><div class="g">${cards}</div><h2>Recent readings &amp; service</h2><table><tr><th>Date</th><th>Compressor</th><th>Type</th><th>Hours</th><th>By</th></tr>${lg}</table><div class="ft">MaintenX · Running-hour based service status</div></div></body></html>`;
 }
 function openDash(){const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to export the dashboard.');return}w.document.open();w.document.write(dash());w.document.close()}
 window.mxC={edit:editC,save:saveC,open:openDash,style:i=>{SI=+i;try{localStorage.setItem('mxCS',i)}catch(e){}}};

   if(r.editedAt){const p=a.querySelector('.recordhead p');if(p)p.textContent+=' · edited'}

  if((page==='compressors'||page==='compressorHistory')&&!app.querySelector('[data-mxcd]')){
   const d=document.createElement('div');d.className='panel section';d.dataset.mxcd='1';d.innerHTML=`<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><label style="font-size:11px;font-weight:700">Dashboard style</label><select onchange="mxC.style(this.value)">${TH.map((t,i)=>`<option value="${i}" ${i===SI?'selected':''}>${i+1}. ${t[0]}</option>`).join('')}</select><button class="btn small" onclick="mxC.open()">📊 Export dashboard</button></div>`;
   const anchor=app.querySelector('.cardlist')||app.lastElementChild;if(anchor)anchor.parentNode.insertBefore(d,anchor)}
 }catch(e){console.error('v35',e)}};
